<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7EBEE0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calendar">
<title>Airbnb Calendar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#ffffff; --bg-subtle:#f5f7f9; --accent-subtle:#e6f2fa; --row-even:#ffffff; --row-odd:#f0f7fb;
  --b-default:#dde2e7; --b-subtle:#eceff2; --b-strong:#b9c1c9;
  --t1:#1b2229; --t2:#4b5763; --t3:#7d8893; --accent:#1f78b4;
  --day-w:46px; --row-h:22px; --name-w:138px; --head-h:36px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
#app{height:100dvh;min-height:100dvh;width:100%;padding:4px;padding-top:max(4px,env(safe-area-inset-top));padding-bottom:calc(max(4px,env(safe-area-inset-bottom)) + 38px);display:flex;flex-direction:column;gap:2px;overflow:hidden}
#meta{font-size:11px;line-height:1.2;color:var(--t3);padding:0 2px;display:flex;align-items:center;gap:6px;position:relative;flex-shrink:0;z-index:8}
#meta .meta-l{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#zoom-reset{flex-shrink:0;height:20px;padding:0 7px;border:0;border-radius:999px;background:var(--accent-subtle);color:var(--accent);font:600 11px/20px system-ui,sans-serif;cursor:pointer}
#zoom-reset[hidden]{display:none}
#today-btn{flex-shrink:0;height:22px;padding:0 11px;border:0;border-radius:999px;background:rgba(118,118,128,.12);color:#007AFF;font:600 12px/22px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;cursor:pointer;touch-action:manipulation;transition:background .15s}
#today-btn:active{background:rgba(118,118,128,.24)}
#lang-sw{display:inline-flex;gap:1px;flex-shrink:0;align-items:center;position:relative}
#lang-sw .lang-pop{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;display:flex;gap:2px;padding:3px;background:#fff;border:1px solid #D1D5DB;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.15);z-index:60}
#lang-sw .lang-pop[hidden]{display:none}
#lang-sw .lang-pop button{opacity:1}
#lang-sw button{width:24px;height:22px;padding:0;border:1.5px solid transparent;border-radius:6px;background:transparent;font:14px/1 "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",system-ui,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;opacity:.55;-webkit-tap-highlight-color:transparent}
#lang-sw button[aria-pressed="true"]{border-color:#007AFF;background:#EAF3FF;opacity:1;box-shadow:0 0 0 1px rgba(0,122,255,.25)}
.months{touch-action:none;cursor:ew-resize}
#names .nrow span{font-size:calc(13px * var(--nzf,1))}
#shell{touch-action:pan-x pan-y}
#search-btn{flex-shrink:0;width:24px;height:24px;border:0;background:transparent;color:var(--t2);padding:0;display:flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer}
#search-btn:hover,#search-btn[aria-expanded="true"]{background:var(--accent-subtle);color:var(--accent)}
#search-panel{display:none;position:absolute;top:calc(100% + 2px);right:0;width:min(280px,calc(100vw - 16px));background:var(--bg);border:1px solid var(--b-default);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.12);padding:6px;z-index:20}
#search-panel.open{display:block}
#search-q{width:100%;font-size:14px;padding:6px 8px;border:1px solid var(--b-default);border-radius:6px;outline:none;color:var(--t1);background:var(--bg)}
#search-q:focus{border-color:var(--accent)}
#search-hits{margin-top:4px;max-height:220px;overflow-y:auto}
#search-hits button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12px;line-height:1.3;color:var(--t1)}
#search-hits button:hover,#search-hits button:focus,#search-hits button.on{background:var(--accent-subtle)}
#search-hits .who{font-weight:600}
#search-hits .sub{color:var(--t3);font-size:11px}
#search-hits .empty{padding:8px;color:var(--t3);font-size:12px}
.bar.hit{z-index:7}
.bar.hit .bar-inner{box-shadow:0 0 0 2px #1F78B4,0 0 8px rgba(31,120,180,.55)}
#shell{display:flex;flex:0 1 auto;min-height:40px;border:1px solid var(--b-default);border-radius:8px;overflow-x:hidden;overflow-y:auto;background:var(--bg);user-select:none;-webkit-user-select:none;align-items:flex-start}
#names{width:var(--name-w);flex-shrink:0;border-right:1px solid var(--b-default);background:var(--bg);z-index:2}
.nhead{height:calc(var(--head-h) + 20px);border-bottom:1px solid var(--b-default);display:flex;align-items:flex-end;padding:0 8px 4px;font-size:12px;font-weight:500;color:var(--t3)}
.nrow{height:var(--row-h);display:flex;align-items:center;gap:4px;padding:0 6px;border-bottom:1px solid var(--b-subtle);background:var(--row-even)}
.nrow.odd{background:var(--row-odd)}
.nrow span{font-size:13px;font-weight:500;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.divider{height:0;border-top:1px dashed var(--b-strong)}
#scroller{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;cursor:grab;touch-action:pan-x pan-y;scrollbar-width:thin}
#scroller.dragging{cursor:grabbing}
#grid{position:relative}
.months{height:14px;display:flex;border-bottom:1px solid var(--b-subtle);background:var(--bg)}
.month{flex-shrink:0;padding-left:0;font-size:11px;font-weight:600;color:var(--t2);display:flex;align-items:center;border-right:1px solid var(--b-subtle);white-space:nowrap}
.month .ml{position:sticky;left:6px}
.days{height:calc(var(--head-h) - 14px);display:flex;border-bottom:1px solid var(--b-default)}
.day{width:var(--day-w);flex-shrink:0;border-right:1px solid var(--b-subtle);display:flex;flex-direction:column;align-items:center;justify-content:center}
.day .wd{font-size:10px;color:var(--t3);line-height:1.1}
.day .dn{font-size:12px;font-weight:500;color:var(--t1);line-height:1.2}
.day.we .dn{color:var(--t2)}
.day.today{background:var(--accent-subtle)}
.day.today .wd,.day.today .dn{color:var(--accent)}
.day.today .dn{font-weight:600}
#body{position:relative}
.cols{position:absolute;inset:0;display:flex;pointer-events:none;z-index:1}
.col{width:var(--day-w);flex-shrink:0;height:100%;border-right:1px solid var(--b-subtle)}
.col.we{background:transparent}
.col.today{background:transparent}
/* Body day washes were opaque and hid row stripes in today (and weekends).
   Header .day.today keeps accent; top triangles mark today/tomorrow. */
.row{position:absolute;left:0;height:var(--row-h);border-bottom:1px solid var(--b-subtle);z-index:2}
.row.div{border-top:1px dashed var(--b-strong)}
.stripes{position:absolute;inset:0;pointer-events:none;z-index:0}
.stripe{position:absolute;left:0;height:var(--row-h);background:var(--row-even)}
.stripe.odd{background:var(--row-odd)}
.bar{position:absolute;top:calc((var(--row-h) - 32px)/2);height:32px;width:auto;display:flex;align-items:center;padding:0;overflow:visible;background:transparent;border-radius:0;box-shadow:none;z-index:3;cursor:pointer;pointer-events:auto}
.bar-inner{width:100%;height:calc(var(--row-h) - 4px);border-radius:999px;color:#1E3A4C;display:flex;align-items:center;flex-wrap:nowrap;gap:2px;padding:0 4px;overflow:hidden;white-space:nowrap;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);pointer-events:none}
.bar .n,.bar .heads,.bar .g,.bar .car,.bar svg,.bar-inner,.bar-inner *{pointer-events:none}
.bar .n{font-size:12px;font-weight:700;line-height:1;letter-spacing:-.02em;flex-shrink:0}
.bar .heads{display:inline-flex;gap:0;flex-shrink:0;align-items:center;margin-left:0}
.bar .heads svg,.bar .car{flex-shrink:0;display:block}
.bar .g{font-size:11px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:2px;flex:1 1 auto;min-width:0}
.dmark{position:absolute;top:0;height:9px;width:var(--day-w);pointer-events:none;z-index:4;clip-path:polygon(0 0,100% 0,50% 100%)}
.dmark.t{background:#000}
.dmark.m{background:rgba(0,0,0,.45)}
/* Today turnover zones + live now line (Europe/Prague; checkout 10 / check-in 15). */
.tzones{position:absolute;top:0;height:100%;display:flex;pointer-events:none;z-index:1}
.tzones *,.tzone-pre,.tzone-clean,.tzone-in{pointer-events:none}
.tzone-pre{height:100%;background:rgba(255,56,92,.05)}
.tzone-clean{height:100%;background:rgba(180,160,40,.10)}
.tzone-in{height:100%;background:rgba(31,120,180,.07)}
.nowline{position:absolute;top:0;width:2px;height:100%;background:repeating-linear-gradient(to bottom,rgba(255,56,92,.7) 0 1.5px,transparent 1.5px 3px);pointer-events:none;z-index:6} /* dotted 2px red (70%), dense 1.5px dots / 1.5px gaps (positions unchanged) */
.nowline.head{top:14px;height:calc(var(--head-h) - 14px);box-shadow:none;z-index:5}

#uklidy{flex-shrink:0;display:flex;gap:4px;padding-top:3px;border-top:1px solid var(--b-subtle);max-height:34dvh;min-height:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-x}
.uk-col{flex:0 0 118px;width:118px;min-width:118px;display:flex;flex-direction:column;gap:1px;overflow:hidden;box-sizing:border-box;position:relative}
.uk-col[data-ukday0]{flex-basis:176px;width:176px;min-width:176px} /* dnes: wider so ⏱ times / VOLNO fit on one line (UK_TODAY_W) */
.uk-col.muted{opacity:.92}
.uk-mark{width:100%;height:8px;flex-shrink:0;pointer-events:none;clip-path:polygon(0 0,100% 0,50% 100%)}
.uk-mark.t{background:#000}
.uk-mark.m{background:rgba(0,0,0,.45)}
.uk-col.muted .uk-h,.uk-col.muted .uk-sub,.uk-col.muted .uk-row .nm,.uk-col.muted .uk-empty{color:var(--t3)}
.uk-h{font-size:11px;font-weight:600;color:var(--t2);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uk-list{overflow-y:auto;min-height:0;flex:1}
.uk-sub{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.04em;line-height:1.2;margin-top:1px}
.uk-rule{border-top:1px solid var(--b-default);margin:3px 0 2px}
.uk-row{display:flex;align-items:center;gap:3px;padding:0;min-width:0;min-height:22px;line-height:1.25;cursor:pointer;pointer-events:auto}
.uk-row > *{pointer-events:none}
.uk-sec{border-radius:4px;padding:1px 3px 2px}
.uk-sec.out{background:rgba(255,56,92,.08)}
.uk-sec.in{background:rgba(40,160,80,.08)}
.lm-pill,.uk-row .lm{display:inline-block;min-width:13px;height:13px;border-radius:999px;background:#E11D48;color:#FFFFFF;font-size:10px;font-weight:800;line-height:13px;text-align:center;flex-shrink:0}
.bar .lm{flex-shrink:0;width:12px;height:12px;border-radius:999px;background:#E11D48;color:#fff;font-size:10px;font-weight:800;line-height:12px;text-align:center}
.tip-lm{color:#BE123C;font-weight:700;display:flex;align-items:center;gap:4px}
/* Urgent-attention alerts (D.A): flashing badge; red ≈0.5 s cycle, yellow ≈0.9 s; steady glow with reduced motion */
.alert-badge{display:inline-flex;align-items:center;gap:2px;flex-shrink:0;height:14px;padding:0 4px;border-radius:999px;box-sizing:border-box;font-size:10px;font-weight:800;line-height:1;white-space:nowrap;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;--glow:rgba(234,179,8,.95);background:#FACC15;color:#1C1400;border:1px solid #A16207;animation:alertFlash .45s ease-in-out infinite alternate}
.alert-badge.red{--glow:rgba(220,38,38,.9);background:#DC2626;color:#FFFFFF;border-color:#7F1D1D;animation-duration:.25s}
.alert-badge.off,.alert-mini.off{display:none!important}
.bar .bar-inner .alert-badge,.uk-row > .alert-badge{pointer-events:auto}
.uk-row > .alert-badge{font-size:9.5px}
.bar > .alert-badge.at-today{position:absolute;top:50%;margin-top:-8px;height:16px;justify-content:center;font-size:10px;letter-spacing:-.01em;transform:translateX(-50%);z-index:4;pointer-events:auto}
.bar.today-alert{z-index:6}
/* t138u action-sheet states: notify keeps flashing + tag; temp = steady amber + tag */
.alert-badge .atag{display:none;margin-left:2px;padding:0 4px;border-radius:999px;background:rgba(255,255,255,.8);color:#1C1400;font-size:.88em;font-weight:800}
.alert-badge.red .atag{color:#7F1D1D}
.alert-badge.notify .atag.n,.alert-badge.temp .atag.t{display:inline}
.alert-badge.temp,.bar > .alert-badge.at-today.temp{animation:none!important;background:#F59E0B!important;border-color:#B45309!important;color:#1C1400!important;box-shadow:0 0 0 1px rgba(180,83,9,.35)!important}
.tip-alert[data-alert-act]{cursor:pointer;position:relative;padding-right:16px}
.tip-act{position:absolute;right:4px;top:0;font-weight:800;opacity:.7}
.tip-atag{display:inline-block;margin-left:4px;padding:0 5px;border-radius:999px;background:#fff;font-size:11px}
.tip-atag.temp{background:#F59E0B;color:#1C1400}
#alert-act{position:fixed;inset:0;z-index:10002;display:flex;align-items:flex-end;justify-content:center;background:rgba(17,24,39,.38)}
#alert-act[hidden]{display:none}
#alert-act .aa-box{width:min(440px,100%);box-sizing:border-box;background:#fff;color:#111827;border-radius:16px 16px 0 0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -4px 22px rgba(0,0,0,.22);font:14px/1.3 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;max-height:92dvh;overflow:auto}
.aa-h{font-weight:800;font-size:16px;display:flex;align-items:center;gap:6px}
.aa-h .lv{width:10px;height:10px;border-radius:999px;background:#FACC15;flex-shrink:0}.aa-h .lv.red{background:#DC2626}
.aa-s{color:#4B5563;font-size:12.5px;margin:3px 0 6px}
.aa-o{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;border-top:1px solid #F1F2F4;cursor:pointer;user-select:none;-webkit-user-select:none}
.aa-o input{width:20px;height:20px;margin:0;flex-shrink:0;accent-color:#007AFF}
.aa-tr{padding:0 2px 4px 32px}
.aa-ctx{font-size:12px;color:#6B7280;margin:0 0 4px}
#aa-text{display:block;width:100%;min-height:74px;box-sizing:border-box;border:1px solid #D1D5DB;border-radius:8px;padding:7px 8px;font:14px/1.35 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#111827;resize:vertical}
#aa-text::placeholder{color:#9CA3AF}
.aa-hint{font-size:11.5px;color:#6B7280;margin-top:4px}
.aa-nh{margin:-4px 0 4px 32px;font-size:11.5px;color:#B91C1C;font-weight:600}.aa-nh[hidden]{display:none}
#alert-toast button[data-alert-more]{color:#FCA5A5}

.aa-b{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;border-top:1px solid #F1F2F4;padding-top:10px}
.aa-b button{height:38px;padding:0 20px;border-radius:999px;border:0;font:700 14px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;cursor:pointer}
.aa-ok{background:#007AFF;color:#fff}.aa-cancel{background:#F3F4F6;color:#111827}
/* over other text: stay opaque, pulse colour + glow instead of fading (readable at every frame) */
.bar > .alert-badge.at-today{animation-name:alertFlashSolid;--bg1:#FACC15;--bg2:#FEF3C7}
.bar > .alert-badge.at-today.red{--bg1:#DC2626;--bg2:#F87171}
@keyframes alertFlashSolid{from{background:var(--bg1);box-shadow:0 0 0 2px var(--glow),0 0 9px var(--glow)}to{background:var(--bg2);box-shadow:0 0 0 0 transparent}}
.uk-row.has-alert{flex-wrap:wrap;row-gap:0}
.uk-row.has-alert .nm{flex:0 1 auto}
.alert-mini{color:#A16207;font-weight:800;margin-right:1px}
.alert-mini.red{color:#DC2626}
@keyframes alertFlash{from{opacity:1;box-shadow:0 0 0 2px var(--glow),0 0 9px var(--glow)}to{opacity:.3;box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion: reduce){.alert-badge{animation:none;box-shadow:0 0 0 2px var(--glow),0 0 7px var(--glow)}}
.tip-alert{font-weight:700;color:#854D0E;background:#FEF3C7;padding:1px 6px;margin:3px -4px 0;border-radius:6px 6px 0 0}
.tip-alert.red{color:#B91C1C;background:#FEE2E2}
.tip-alert-note{color:#374151;background:#FEF3C7;padding:1px 6px;margin:0 -4px 3px;border-radius:0 0 6px 6px}
.tip-alert-note.red{background:#FEE2E2}
#alert-chip{flex-shrink:0;height:22px;padding:0 9px;border:0;border-radius:999px;background:#FACC15;color:#1C1400;font:800 12px/22px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;cursor:pointer;touch-action:manipulation}
#alert-chip.red{background:#DC2626;color:#fff}
#alert-chip[hidden]{display:none}
#alert-toast{position:fixed;left:50%;bottom:50px;transform:translateX(-50%);z-index:10001;display:flex;align-items:center;gap:10px;background:#111827;color:#fff;border-radius:999px;padding:5px 6px 5px 14px;font:600 13px/1.2 system-ui,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.3);white-space:nowrap}
#alert-toast[hidden]{display:none}
#alert-toast{left:0;right:0;margin:0 auto;width:fit-content;transform:none;max-width:calc(100vw - 16px);box-sizing:border-box;white-space:normal}#alert-toast button{white-space:nowrap;flex-shrink:0}
#alert-toast button{border:0;border-radius:999px;background:rgba(255,255,255,.16);color:#93C5FD;font:700 13px/24px system-ui,sans-serif;padding:0 10px;cursor:pointer}
.uk-row .nm{font-size:11px;font-weight:500;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.uk-empty{font-size:11px;color:var(--t3)}
/* Parking button + slide-out panel (14 angled spots) */
#park-btn{position:fixed;left:6px;bottom:max(4px,env(safe-area-inset-bottom));width:34px;height:34px;border-radius:999px;border:1px solid #D1D5DB;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;z-index:9000}
#park-btn span{width:22px;height:22px;border-radius:4px;background:#1D4ED8;color:#fff;font-weight:800;font-size:16px;line-height:22px;text-align:center}
#park-count{position:fixed;left:46px;bottom:calc(max(4px,env(safe-area-inset-bottom)) + 6px);height:22px;line-height:22px;padding:0 10px;border-radius:999px;background:#F3F4F6;border:1px solid #D1D5DB;color:#111827;font-size:12px;font-weight:600;white-space:nowrap;z-index:9000;pointer-events:auto;cursor:pointer;font-family:inherit;margin:0}
/* parking = in-flow bottom sheet under the cleaning panel (stacked, never overlapping) */
#park-panel{display:none;flex-shrink:0;flex-direction:column;box-sizing:border-box;background:#fff;color:#111827;border:1px solid #D1D5DB;border-radius:12px 12px 8px 8px;box-shadow:0 -2px 10px rgba(0,0,0,.08);overflow:hidden;opacity:0}
#park-panel.open{display:flex;opacity:1}
#park-handle{flex:0 0 auto;touch-action:none;cursor:ns-resize;user-select:none;-webkit-user-select:none}
#park-handle .sheet-grab{height:26px;display:flex;align-items:center;justify-content:center}
#park-panel.tucked #park-handle .sheet-grab{height:20px}
#park-tuck{display:none;height:28px;align-items:center;gap:6px;padding:0 10px 2px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden}
#park-tuck .pt-sub{font-weight:600;color:#374151}
#park-panel.tucked #park-tuck{display:flex}
#park-panel.tucked #park-body{display:none}
#park-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 10px 10px}
.sheet-grab i{display:block;width:40px;height:5px;border-radius:3px;background:#C3C8CF}
#park-panel .ph{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:4px;font-weight:700;font-size:13px}
#park-panel .pbar{height:6px;border-radius:999px;background:#E5E7EB;overflow:hidden;margin-bottom:6px}
#park-panel .pbar div{height:100%}
#park-panel .plist{font-size:11px;color:#374151;margin-top:6px;line-height:1.35}
#park-panel .pnote{font-size:11px;color:#4B5563;margin-top:2px}
#park-panel .ptabs{display:inline-flex;background:#E5E7EB;border-radius:8px;padding:2px;gap:2px}
#park-panel .ptabs button{border:0;border-radius:6px;padding:2px 10px;font-size:12px;font-weight:600;cursor:pointer;background:transparent;color:#111827}

#tech-panel .tp-a b{font-size:13px}
#tech-panel .tp-a small{grid-column:2;color:#6B7280;font-size:11px}
#tech-panel .tp-a .pt{grid-column:2;font-weight:800;font-size:12.5px;color:#92400E}
#tech-panel .tp-a.red .pt{color:#B91C1C}
#tech-panel .tp-a svg{grid-row:1/4}
@media (prefers-reduced-motion: reduce){#tech-badge.red,#tech-panel .tp-al svg{animation:none!important}#tech-panel.open{animation:none}}
#uk-wrap.sized #uklidy{flex:1 1 auto;max-height:none}
#uk-wrap:not(.tucked) .uk-col{zoom:var(--ukz,1)}
#uk-zoom-reset{margin-left:auto;flex-shrink:0;height:18px;padding:0 7px;border:0;border-radius:999px;background:var(--accent-subtle);color:var(--accent);font:600 10px/18px system-ui,sans-serif;letter-spacing:0;text-transform:none;cursor:pointer;touch-action:manipulation}
#uk-zoom-reset[hidden]{display:none}
#uk-wrap #uklidy{border-top:0}
#uk-handle{position:relative;height:30px;flex:0 0 30px;display:flex;align-items:center;gap:5px;padding:9px 6px 0;border-top:1px solid var(--b-subtle);cursor:ns-resize;user-select:none;-webkit-user-select:none;touch-action:none;color:var(--t3);font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
#uk-handle svg{flex-shrink:0;transition:transform 360ms cubic-bezier(.32,.72,0,1)}
#uk-wrap.tucked #uk-handle svg{transform:rotate(180deg)}
#uk-handle .uk-sum{text-transform:none;letter-spacing:0;font-weight:500}
#uk-handle .sheet-grab{position:absolute;left:0;right:0;top:3px;display:flex;justify-content:center;pointer-events:none}
.uk-cmp{display:none;grid-template-columns:24px minmax(0,1fr);grid-template-rows:16px 16px;row-gap:1px;column-gap:2px}
#uk-wrap.tucked .uk-cmp{display:grid}
#uk-wrap.tucked .uk-mark,#uk-wrap.tucked .uk-h,#uk-wrap.tucked .uk-list{display:none}
.uk-cmp .d{font-size:10px;font-weight:600;color:var(--t2);line-height:16px;white-space:nowrap}
.uk-ln{height:16px;line-height:16px;border-radius:4px;padding:0 3px;font-size:11px;font-weight:500;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.uk-col.muted .uk-cmp .d,.uk-col.muted .uk-ln{color:var(--t3)}
.uk-ln.out{background:rgba(255,56,92,.08)}
.uk-ln.in{background:rgba(40,160,80,.08)}
.uk-ln b{font-weight:700;margin-right:3px}
.uk-ln .t{font-weight:600}
.uk-ln .lm{display:inline-block;min-width:11px;height:11px;border-radius:999px;background:#E11D48;color:#FFFFFF;font-size:9px;font-weight:800;line-height:11px;text-align:center;margin-right:2px;vertical-align:1px}
/* t155u PIN dialog + command status */
#tech-pin{position:fixed;inset:0;z-index:10000;background:rgba(17,24,39,.45);display:flex;align-items:center;justify-content:center;padding:16px}
#tech-pin[hidden]{display:none}
#tech-pin .tpn{background:#fff;color:#111827;border-radius:14px;box-shadow:0 12px 34px rgba(0,0,0,.3);width:min(320px,100%);padding:16px;font:14px/1.35 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}
#tech-pin b{display:block;font-size:16px;margin-bottom:4px}
#tech-pin p{margin:0 0 10px;color:#4B5563;font-size:12.5px}
#tech-pin input{display:block;width:100%;box-sizing:border-box;font:16px system-ui,sans-serif;padding:9px 10px;border:1px solid #D1D5DB;border-radius:9px;margin:6px 0}
#tech-pin .tpn-e{color:#B91C1C;font-weight:700;font-size:12.5px;min-height:16px}
#tech-pin .tpn-b{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
#tech-pin .tpn-b button{border:0;border-radius:9px;padding:8px 14px;font:700 14px system-ui,sans-serif;cursor:pointer}
#tech-pin .tpn-ok{background:#2563EB;color:#fff}#tech-pin .tpn-no{background:#F3F4F6;color:#374151}
#tech-panel .tp-pend[data-st="applied"]{color:#047857}
#tech-panel .tp-pend[data-st="failed"],#tech-panel .tp-pend[data-st="expired"],#tech-panel .tp-pend[data-st="rejected"],#tech-panel .tp-pend[data-st="err"]{color:#B91C1C}
</style>

// Calendar ↔ uklidy now-line coupling: uklidy follows the calendar so both red lines share one screen x.
// Sliding uklidy decouples it; when a slide ends within half a column of the calendar line it snaps back and re-couples.
const NOW_SYNC={cal:sc,uk:NOW_SYNC_UK(),coupled:true,prog:-1,held:false,anim:0,endTimer:0};

  const UK_W=118, SNAP_MS=180, END_MS=120, S=NOW_SYNC, uk=S.uk;
  S.prog=uk.scrollLeft;
  const frac=()=>pragueParts().ymd===D.t?pragueDayFraction():0.5;
  // screen-x of the uklidy now-line minus the calendar now-line
  const delta=()=>{const cd=sc.querySelector("[data-calday0]"),ud=uk.querySelector("[data-ukday0]");if(!cd||!ud)return null;const f=frac(),c=cd.getBoundingClientRect(),u=ud.getBoundingClientRect();return u.left+f*u.width-(c.left+f*c.width)};

  const align=()=>{const d=delta();if(d!==null&&Math.abs(d)>=0.5)set(uk.scrollLeft+d)};
  const snap=()=>{const d=delta();if(d===null)return;stop();S.coupled=true;const from=uk.scrollLeft,t0=performance.now();
    const step=t=>{const p=Math.min(1,Math.max(0,(t-t0)/SNAP_MS));set(from+d*(1-Math.pow(1-p,3)));if(p<1)S.anim=requestAnimationFrame(step);else{S.anim=0;align()}};
    S.anim=requestAnimationFrame(step)};

  sc.addEventListener("scroll",()=>{if(S.coupled){stop();align()}else schedEnd()},{passive:true});
  uk.addEventListener("scroll",()=>{

(function(){

    const gl=gc<0?"?":String(gc);
    const q=(D.Q&&D.Q[code])||["n",-1,""];
    const plate=(D.P&&D.P[code])||"";

      h+=`</section>`}
    return h+`<div class="tp-src">Smart Life · Smart RM</div>`}
  let LOG_DONE=null;
  function askLog(a,sj,label){return new Promise(res=>{let w=document.getElementById("tech-log");if(!w){w=document.createElement("div");w.id="tech-log";document.body.appendChild(w)}
    const isD=a==="bilge_desc",prev=isD?((tlOf(sj).find(e=>e.a==="bilge_desc")||{}).n||""):"";
    w.innerHTML=`<form data-tech-log role="dialog" aria-modal="true" aria-label="${esc(T("a_"+a))}"><b>${esc(T("a_"+a))}</b><p>${esc(label)} · ${esc(fD(new Date().toISOString()))}</p>${isD?`<textarea data-tl-in="note" rows="5" maxlength="2000" placeholder="${esc(T("tl_desc_ph"))}">${esc(prev)}</textarea>`:`<input data-tl-in="note" type="text" maxlength="300" placeholder="${esc(T("tl_note"))}">`}<input data-tl-in="by" type="text" maxlength="40" autocomplete="name" placeholder="${esc(T("tl_by"))}" value="${esc(nameGet())}"><div class="row"><button type="button" data-tl-no>${esc(T("tl_cancel"))}</button><button type="submit" class="ok" data-tl-ok>${esc(T("tl_save"))}</button></div></form>`;
    w.hidden=false;const f=w.querySelector("form"),nt=f.querySelector('[data-tl-in="note"]');
    const done=v=>{LOG_DONE=null;w.hidden=true;w.innerHTML="";res(v)};LOG_DONE=done;
    f.onsubmit=e=>{e.preventDefault();const n=nt.value.trim(),by=f.querySelector('[data-tl-in="by"]').value.trim();if(isD&&(!n||n===prev)){nt.focus();return}done({n,by})};
    f.querySelector("[data-tl-no]").onclick=()=>done(null);w.onclick=e=>{if(e.target===w)done(null)};setTimeout(()=>nt.focus(),30)})}
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&LOG_DONE){e.stopImmediatePropagation();LOG_DONE(null)}},true);
  function alertView(){
    const rows=[];P.forEach(x=>x.p.forEach(k=>rows.push({x,k,r:RED.includes(k)})));
    rows.sort((a,b)=>(b.r-a.r)||(kindOf(b.x.d[1])-kindOf(a.x.d[1]))||a.x.d[1].localeCompare(b.x.d[1],"cs"));
    let h=`<button type="button" class="tp-back" data-tech-back>‹ ${esc(T("tech_back"))}</button>`;
    if(!rows.length)return h+`<div class="tp-empty" data-tech-noalerts>${tri("",30)}<b>${esc(T("tech_no_alerts"))}</b></div>`;
    for(const {x,k,r} of rows){const [,l,t,name,,,u]=x.d;
      h+=`<div class="tp-a${r?" red":""}" data-tech-alert="${k}" data-sev="${r?"red":"yellow"}">${tri(r?"red":"yellow",20)}<b>${esc(l)} · ${esc(name||T("t_"+t))}</b><span class="pt">${esc(T("p_"+k))}</span><small>${esc(T("t_"+t))}${u&&fU(u)?" · "+esc(T("tech_detected",fU(u))):""}</small></div>`}
    return h}
  function render(){const sb=panel.querySelector(".tp-b"),st=sb?sb.scrollTop:0;
    panel.innerHTML=`<div class="tp-h"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#374151" d="M21.67 18.17l-5.3-5.3h-.99l-2.54 2.54v.99l5.3 5.3c.39.39 1.02.39 1.41 0l2.12-2.12c.39-.38.39-1.02 0-1.41zM17.34 10.19l1.41-1.41 2.12 2.12c1.17-1.17 1.17-3.07 0-4.24l-3.54-3.54-1.41 1.41V1.71l-.7-.71-3.54 3.54.71.71h2.83l-1.41 1.41 1.06 1.06-2.89 2.89-4.13-4.13V5.06L4.83 2.04 2 4.87 5.03 7.9h1.41l4.13 4.13-.85.85H7.6l-5.3 5.3c-.39.39-.39 1.02 0 1.41l2.12 2.12c.39.39 1.02.39 1.41 0l5.3-5.3v-2.12l5.15-5.15 1.06 1.05z"/></svg><b>${esc(T("tech"))}</b><button type="button" class="tp-al ${SEV}" data-tech-alerts data-sev="${SEV||"none"}" aria-pressed="${view==="alerts"}" aria-label="${esc(T("tech_alerts"))}${nProb?" – "+nProb:""}">${tri(SEV,20)}${nProb?`<span>${nProb}</span>`:""}</button><button type="button" class="tp-x" data-tech-close aria-label="${esc(T("tech_close"))}">✕</button></div><div class="tp-b">${view==="alerts"?alertView():devView()}</div>`;
    if(view==="dev"&&st)panel.querySelector(".tp-b").scrollTop=st}
  const CMD_KEY="techCommands",FINAL=["applied","failed","expired","rejected"];
  const cmdsGet=()=>{try{const q=JSON.parse(localStorage.getItem(CMD_KEY)||"[]");return Array.isArray(q)?q:[]}catch(_){return[]}};
  const cmdsPut=q=>{try{localStorage.setItem(CMD_KEY,JSON.stringify(q.slice(-100)))}catch(_){}};
  async function queue(x,k,v,retry){if(!CAN||!x.d[7])return;let pin=pinGet();if(!pin){pin=await askPin();if(!pin)return}
    (PEND[x.i]=PEND[x.i]||{})[k]=v;CST[x.i+"|"+k]={s:"sending"};render();
    let r;try{r=await sbRpc("queue_tech_command",{p_pin:pin,p_device_id:x.d[7],p_key:KMAP[k],p_value:v,p_by_name:nameGet()||null})}catch(_){r={ok:false,error:"net"}}
    if(!r||!r.ok){const e=(r&&r.error)||"net";delete PEND[x.i][k];CST[x.i+"|"+k]={s:"err",e};
      if(e==="pin_invalid"||e==="pin_not_set"){pinSet("");render();if(!retry){const p=await askPin(sbErr(e));if(p)return queue(x,k,v,true)}return}
      render();return}
    CST[x.i+"|"+k]={s:"sent",id:r.id};const q=cmdsGet();q.push({id:r.id,device:x.d[7],listing:x.d[1],key:k,value:v,requestedAt:new Date().toISOString(),status:"pending"});cmdsPut(q);render();poll()}
  let pollT=0;
  async function poll(){clearTimeout(pollT);const q=cmdsGet(),cut=Date.now()-20*60e3;
    const open=q.filter(c=>c.id&&!FINAL.includes(c.status)&&Date.parse(c.requestedAt)>cut);if(!open.length||!SB_ON)return;
    let st=[];try{st=await sbRpc("tech_command_status",{p_ids:open.map(c=>c.id)})}catch(_){pollT=setTimeout(poll,30e3);return}
    const by=new Map((Array.isArray(st)?st:[]).map(r=>[r.id,r]));let ch=false;
    for(const c of q){const r=by.get(c.id);if(!r||r.status===c.status)continue;c.status=r.status;c.error=r.error||"";ch=true;
      const x=P.find(p=>p.d[7]===c.device);if(!x)continue;const ck=x.i+"|"+c.key;
      if(CST[ck]&&CST[ck].id&&CST[ck].id!==c.id)continue;
      CST[ck]={s:r.status==="pending"?"sent":r.status,id:c.id,e:r.error||""};if(r.status!=="applied"&&r.status!=="pending"&&PEND[x.i])delete PEND[x.i][c.key]}
    if(ch){cmdsPut(q);if(panel.classList.contains("open"))render()}
    if(q.some(c=>c.id&&!FINAL.includes(c.status)&&Date.parse(c.requestedAt)>cut))pollT=setTimeout(poll,15e3)}
  if(CAN){for(const c of cmdsGet()){if(!c.id||Date.parse(c.requestedAt)<Date.now()-20*60e3)continue;const x=P.find(p=>p.d[7]===c.device);if(!x)continue;
      if(c.status==="pending"){(PEND[x.i]=PEND[x.i]||{})[c.key]=c.value;CST[x.i+"|"+c.key]={s:"sent",id:c.id}}}poll()}
  function place(){const r=btn.getBoundingClientRect();panel.style.bottom=Math.max(46,Math.round(innerHeight-r.top+8))+"px"}
  function setOpen(on){if(on){view="dev";render();place();if(typeof hideTip==="function")hideTip()}panel.classList.toggle("open",on);btn.setAttribute("aria-expanded",on?"true":"false")}
  btn.addEventListener("click",e=>{e.stopPropagation();setOpen(!panel.classList.contains("open"))});
  panel.addEventListener("click",e=>{
    if(e.target.closest("[data-tech-close]")){setOpen(false);return}
    if(e.target.closest("[data-tech-alerts]")){view=view==="alerts"?"dev":"alerts";render();return}
    if(e.target.closest("[data-tech-back]")){view="dev";render();return}
    const lh=e.target.closest("[data-tech-lh]");if(lh){const n=lh.dataset.techLh;if(OPEN_MC.has(n))OPEN_MC.delete(n);else OPEN_MC.add(n);render();return}
    const sh=e.target.closest("[data-tech-sh]");if(sh){const k=sh.dataset.techSh;SEC_OPEN[k]=!SEC_OPEN[k];try{localStorage.setItem(SEC_KEY,JSON.stringify(SEC_OPEN))}catch(_){}render();return}
    const hb=e.target.closest("[data-tl-hist]");if(hb){const k=hb.dataset.tlHist;if(OPEN_H.has(k))OPEN_H.delete(k);else OPEN_H.add(k);render();return}
    const ab=e.target.closest("[data-tl-a]");if(ab){const a=ab.dataset.tlA,sj=ab.dataset.tlS,lb=ab.dataset.tlL;askLog(a,sj,lb).then(v=>{if(!v)return;if(v.by){try{localStorage.setItem(NAME_KEY,v.by)}catch(_){}}tlAdd(sj,a,v.by,v.n);render()});return}
    const c=e.target.closest("[data-tc]");if(!c||c.disabled||!CAN)return;const x=P[+c.dataset.i];if(!x)return;const k=c.dataset.tc;
    if(k==="set"){const cur=val(x,"set");if(!num(cur))return;queue(x,"set",Math.min(28,Math.max(5,Math.round((cur+ +c.dataset.d)*2)/2)))}
    else if(k==="on")queue(x,"on",!(val(x,"on")===true));else if(k==="mode")queue(x,"mode",c.dataset.v);render()});
  document.addEventListener("pointerdown",e=>{if(!panel.classList.contains("open"))return;if(e.target.closest("#tech-panel,#tech-btn,#tech-pin,#tech-log"))return;setOpen(false)});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&panel.classList.contains("open")){const pd=document.getElementById("tech-pin");if(pd&&!pd.hidden)return;setOpen(false)}});
  addEventListener("resize",()=>{if(panel.classList.contains("open"))place()});
})();

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
})();
</script>
