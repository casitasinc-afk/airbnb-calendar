<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7EBEE0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calendar">
<title>Airbnb Calendar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#ffffff; --bg-subtle:#f5f7f9; --accent-subtle:#e6f2fa; --row-even:#ffffff; --row-odd:#f0f7fb;
  --b-default:#dde2e7; --b-subtle:#eceff2; --b-strong:#b9c1c9;
  --t1:#1b2229; --t2:#4b5763; --t3:#7d8893; --accent:#1f78b4;
  --day-w:46px; --row-h:22px; --name-w:138px; --head-h:36px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
#app{height:100dvh;min-height:100dvh;width:100%;padding:4px;padding-top:max(4px,env(safe-area-inset-top));padding-bottom:calc(max(4px,env(safe-area-inset-bottom)) + 38px);display:flex;flex-direction:column;gap:2px;overflow:hidden}
#meta{font-size:11px;line-height:1.2;color:var(--t3);padding:0 2px;display:flex;align-items:center;gap:6px;position:relative;flex-shrink:0;z-index:8}
#meta .meta-l{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#zoom-reset{flex-shrink:0;height:20px;padding:0 7px;border:0;border-radius:999px;background:var(--accent-subtle);color:var(--accent);font:600 11px/20px system-ui,sans-serif;cursor:pointer}
#zoom-reset[hidden]{display:none}
#today-btn{flex-shrink:0;height:22px;padding:0 11px;border:0;border-radius:999px;background:rgba(118,118,128,.12);color:#007AFF;font:600 12px/22px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;cursor:pointer;touch-action:manipulation;transition:background .15s}
#today-btn:active{background:rgba(118,118,128,.24)}
#lang-sw{display:inline-flex;gap:1px;flex-shrink:0;align-items:center;position:relative}
#lang-sw .lang-pop{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;display:flex;gap:2px;padding:3px;background:#fff;border:1px solid #D1D5DB;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.15);z-index:60}
#lang-sw .lang-pop[hidden]{display:none}
#lang-sw .lang-pop button{opacity:1}
#lang-sw button{width:24px;height:22px;padding:0;border:1.5px solid transparent;border-radius:6px;background:transparent;font:14px/1 "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",system-ui,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;opacity:.55;-webkit-tap-highlight-color:transparent}
#lang-sw button[aria-pressed="true"]{border-color:#007AFF;background:#EAF3FF;opacity:1;box-shadow:0 0 0 1px rgba(0,122,255,.25)}
.months{touch-action:none;cursor:ew-resize}
#names .nrow span{font-size:calc(13px * var(--nzf,1))}
#shell{touch-action:pan-x pan-y}
#search-btn{flex-shrink:0;width:24px;height:24px;border:0;background:transparent;color:var(--t2);padding:0;display:flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer}
#search-btn:hover,#search-btn[aria-expanded="true"]{background:var(--accent-subtle);color:var(--accent)}
#search-panel{display:none;position:absolute;top:calc(100% + 2px);right:0;width:min(280px,calc(100vw - 16px));background:var(--bg);border:1px solid var(--b-default);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.12);padding:6px;z-index:20}
#search-panel.open{display:block}
#search-q{width:100%;font-size:14px;padding:6px 8px;border:1px solid var(--b-default);border-radius:6px;outline:none;color:var(--t1);background:var(--bg)}
#search-q:focus{border-color:var(--accent)}
#search-hits{margin-top:4px;max-height:220px;overflow-y:auto}
#search-hits button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12px;line-height:1.3;color:var(--t1)}
#search-hits button:hover,#search-hits button:focus,#search-hits button.on{background:var(--accent-subtle)}
#search-hits .who{font-weight:600}
#search-hits .sub{color:var(--t3);font-size:11px}
#search-hits .empty{padding:8px;color:var(--t3);font-size:12px}
.bar.hit{z-index:7}
.bar.hit .bar-inner{box-shadow:0 0 0 2px #1F78B4,0 0 8px rgba(31,120,180,.55)}
#shell{display:flex;flex:0 1 auto;min-height:40px;border:1px solid var(--b-default);border-radius:8px;overflow-x:hidden;overflow-y:auto;background:var(--bg);user-select:none;-webkit-user-select:none;align-items:flex-start}
#names{width:max-content;max-width:var(--name-w);/* t295u: fit the longest name */flex-shrink:0;border-right:1px solid var(--b-default);background:var(--bg);z-index:2}
.nhead{height:calc(var(--head-h) + 20px);border-bottom:1px solid var(--b-default);display:flex;align-items:flex-end;padding:0 8px 4px;font-size:12px;font-weight:500;color:var(--t3)}
.nrow{height:var(--row-h);display:flex;align-items:center;gap:4px;padding:0 6px;border-bottom:1px solid var(--b-subtle);background:var(--row-even)}
.nrow.odd{background:var(--row-odd)}
.nrow span{font-size:13px;font-weight:500;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.divider{height:0;border-top:1px dashed var(--b-strong)}
#scroller{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;cursor:grab;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
#scroller.dragging{cursor:grabbing}
#grid{position:relative}
.months{height:14px;display:flex;border-bottom:1px solid var(--b-subtle);background:var(--bg)}
.month{flex-shrink:0;padding-left:0;font-size:11px;font-weight:600;color:var(--t2);display:flex;align-items:center;border-right:1px solid var(--b-subtle);white-space:nowrap}
.month .ml{position:sticky;left:6px}
.days{height:calc(var(--head-h) - 14px);display:flex;border-bottom:1px solid var(--b-default)}
.day{width:var(--day-w);flex-shrink:0;border-right:1px solid var(--b-subtle);display:flex;flex-direction:column;align-items:center;justify-content:center}
.day .wd{font-size:10px;color:var(--t3);line-height:1.1}
.day .dn{font-size:12px;font-weight:500;color:var(--t1);line-height:1.2}
.day.we .dn{color:var(--t2)}
.day.today{background:var(--accent-subtle)}
.day.today .wd,.day.today .dn{color:var(--accent)}
.day.today .dn{font-weight:600}
#body{position:relative}
.cols{position:absolute;inset:0;display:flex;pointer-events:none;z-index:1}
.col{width:var(--day-w);flex-shrink:0;height:100%;border-right:1px solid var(--b-subtle)}
.col.we{background:transparent}
.col.today{background:transparent}
/* Body day washes were opaque and hid row stripes in today (and weekends).
   Header .day.today keeps accent; top triangles mark today/tomorrow. */
.row{position:absolute;left:0;height:var(--row-h);border-bottom:1px solid var(--b-subtle);z-index:2;pointer-events:none}
.row.div{border-top:1px dashed var(--b-strong)}
.stripes{position:absolute;inset:0;pointer-events:none;z-index:0}
.stripe{position:absolute;left:0;height:var(--row-h);background:var(--row-even)}
.stripe.odd{background:var(--row-odd)}
.bar{position:absolute;top:calc((var(--row-h) - 32px)/2);height:32px;width:auto;display:flex;align-items:center;padding:0;overflow:visible;background:rgba(0,0,0,0.001);border-radius:0;box-shadow:none;z-index:3;cursor:pointer;pointer-events:auto}
.bar::after{content:"";position:absolute;inset:0;z-index:0;background:rgba(0,0,0,0.001);pointer-events:auto;border-radius:999px}
.bar-inner{width:100%;height:calc(var(--row-h) - 4px);border-radius:999px;color:#1E3A4C;display:flex;align-items:center;flex-wrap:nowrap;gap:2px;padding:0 4px;overflow:hidden;white-space:nowrap;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);pointer-events:none}
.bar .n,.bar .heads,.bar .g,.bar .car,.bar svg,.bar-inner,.bar-inner *{pointer-events:none}
.bar .n{font-size:12px;font-weight:700;line-height:1;letter-spacing:-.02em;flex-shrink:0}
.bar .heads{display:inline-flex;gap:0;flex-shrink:0;align-items:center;margin-left:0}
.bar .heads svg,.bar .car{flex-shrink:0;display:block}
.bar .g{font-size:11px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:2px;flex:1 1 auto;min-width:0}
.dmark{position:absolute;top:0;height:9px;width:var(--day-w);pointer-events:none;z-index:4;clip-path:polygon(0 0,100% 0,50% 100%)}
.dmark.t{background:#000}
.dmark.m{background:rgba(0,0,0,.45)}
/* Today turnover zones + live now line (Europe/Prague; checkout 10 / check-in 15). */
.tzones{position:absolute;top:0;height:100%;display:flex;pointer-events:none;z-index:1}
.tzones *,.tzone-pre,.tzone-clean,.tzone-in{pointer-events:none}
.tzone-pre{height:100%;background:rgba(255,56,92,.05)}
.tzone-clean{height:100%;background:rgba(180,160,40,.10)}
.tzone-in{height:100%;background:rgba(31,120,180,.07)}
.nowline{position:absolute;top:0;width:2px;height:100%;background:repeating-linear-gradient(to bottom,rgba(255,56,92,.7) 0 1.5px,transparent 1.5px 3px);pointer-events:none;z-index:6} /* dotted 2px red (70%), dense 1.5px dots / 1.5px gaps (positions unchanged) */
.nowline.head{top:14px;height:calc(var(--head-h) - 14px);box-shadow:none;z-index:5}
/* t239u: parking fullscreen (tap open); swipe-open keeps the sheet height */
#park-fullbar{display:none;align-items:center;gap:10px;flex:0 0 auto;padding:8px 10px;border-bottom:1px solid #E5E7EB;background:#fff;z-index:1}
#park-fullbar .pf-title{flex:1;min-width:0;font:700 16px/1.2 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#park-back,#park-x{flex-shrink:0;width:48px;height:48px;min-width:44px;min-height:44px;border:0;border-radius:999px;background:#F3F4F6;color:#111827;font:700 36px/1 system-ui,sans-serif;cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#park-back:active,#park-x:active{background:#E5E7EB}
#park-panel.full{position:fixed;inset:0;width:100%!important;height:100%!important;max-height:none;margin:0;align-self:stretch;border-radius:0;border:0;box-shadow:none;z-index:9600;opacity:1;display:flex;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);background:#fff}
#park-panel.full #park-fullbar{display:flex}
#park-panel.full #park-handle{display:none}
#park-panel.full #park-body{flex:1 1 auto;min-height:0;overflow-y:auto}
#park-panel.full .ph{flex-wrap:wrap;align-items:center}
body.park-full{overflow:hidden}
body.park-full #park-btn,body.park-full #park-count,body.park-full #tech-btn,body.park-full #sheet-dock{visibility:hidden;pointer-events:none}
body.park-full #wp-btn{visibility:hidden;pointer-events:none}
body.wp-open{overflow:hidden}
body.wp-open #park-btn,body.wp-open #park-count,body.wp-open #tech-btn,body.wp-open #sheet-dock,body.wp-open #wp-btn{visibility:hidden;pointer-events:none}

#uklidy{flex-shrink:0;display:flex;gap:4px;padding-top:3px;border-top:1px solid var(--b-subtle);max-height:34dvh;min-height:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-x}
.uk-col{flex:0 0 118px;width:118px;min-width:118px;display:flex;flex-direction:column;gap:1px;overflow:hidden;box-sizing:border-box;position:relative}
.uk-col[data-ukday0]{flex-basis:176px;width:176px;min-width:176px} /* dnes: wider so ⏱ times / VOLNO fit on one line (UK_TODAY_W) */
.uk-col.muted{opacity:.92}
.uk-mark{width:100%;height:8px;flex-shrink:0;pointer-events:none;clip-path:polygon(0 0,100% 0,50% 100%)}
.uk-mark.t{background:#000}
.uk-mark.m{background:rgba(0,0,0,.45)}
.uk-col.muted .uk-h,.uk-col.muted .uk-sub,.uk-col.muted .uk-row .nm,.uk-col.muted .uk-empty{color:var(--t3)}
.uk-h{font-size:11px;font-weight:600;color:var(--t2);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uk-list{overflow-y:auto;min-height:0;flex:1}
.uk-sub{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.04em;line-height:1.2;margin-top:1px}
.uk-rule{border-top:1px solid var(--b-default);margin:3px 0 2px}
.uk-row{display:flex;align-items:center;gap:3px;padding:0;min-width:0;min-height:22px;line-height:1.25;cursor:pointer;pointer-events:auto}
.uk-row > *{pointer-events:none}
.uk-sec{border-radius:4px;padding:1px 3px 2px}
.uk-sec.out{background:rgba(255,56,92,.08)}
.uk-sec.in{background:rgba(40,160,80,.08)}
.lm-pill,.uk-row .lm{display:inline-block;min-width:13px;height:13px;border-radius:999px;background:#E11D48;color:#FFFFFF;font-size:10px;font-weight:800;line-height:13px;text-align:center;flex-shrink:0}
.bar .lm{flex-shrink:0;width:12px;height:12px;border-radius:999px;background:#E11D48;color:#fff;font-size:10px;font-weight:800;line-height:12px;text-align:center}
.tip-lm{color:#BE123C;font-weight:700;display:flex;align-items:center;gap:4px}
/* Urgent-attention alerts (D.A): flashing badge; red ≈0.5 s cycle, yellow ≈0.9 s; steady glow with reduced motion */
.alert-badge{display:inline-flex;align-items:center;gap:2px;flex-shrink:0;height:14px;padding:0 4px;border-radius:999px;box-sizing:border-box;font-size:10px;font-weight:800;line-height:1;white-space:nowrap;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;--glow:rgba(234,179,8,.95);background:#FACC15;color:#1C1400;border:1px solid #A16207;animation:alertFlash .45s ease-in-out infinite alternate}
.alert-badge.red{--glow:rgba(220,38,38,.9);background:#DC2626;color:#FFFFFF;border-color:#7F1D1D;animation-duration:.25s}
.alert-badge.off,.alert-mini.off{display:none!important}
/* t183u: a tap that is only on THIS device never hides or recounts a warning; it is tagged "jen zde" (dashed blue) */
.alert-badge.lonly::after{content:var(--lo-txt);margin-left:3px;padding:0 4px;border-radius:999px;background:#fff;color:#1E3A8A;border:1px dashed #1D4ED8;font-size:.85em;font-weight:800;white-space:nowrap}
.alert-badge.lo-solved{--lo-txt:var(--lo-solved);animation:none!important;opacity:.8}.alert-badge.lo-temp{--lo-txt:var(--lo-temp)}.alert-badge.lo-notify{--lo-txt:var(--lo-notify)}.alert-badge.lo-clear{--lo-txt:var(--lo-clear)}
.tip-atag.lo,.tl-lo{background:#EFF6FF!important;color:#1E3A8A!important;border:1px dashed #1D4ED8}
.tl-lo{display:inline-block;margin-left:6px;padding:0 5px;border-radius:999px;font-size:11px;font-weight:700;font-style:normal}
#data-new{position:fixed;left:50%;top:max(6px,env(safe-area-inset-top));transform:translateX(-50%);z-index:99999;border:0;border-radius:999px;background:#1D4ED8;color:#fff;font:800 13px/1 system-ui,sans-serif;padding:9px 14px;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer}
#data-new[hidden]{display:none}
.bar .bar-inner .alert-badge,.uk-row > .alert-badge{pointer-events:auto}
.uk-row > .alert-badge{font-size:9.5px}
.bar > .alert-badge.at-today{position:absolute;top:50%;margin-top:-8px;height:16px;justify-content:center;font-size:10px;letter-spacing:-.01em;transform:translateX(-50%);z-index:4;pointer-events:auto}
.bar.today-alert{z-index:6}
/* t138u action-sheet states: notify keeps flashing + tag; temp = steady amber + tag */
.alert-badge .atag{display:none;margin-left:2px;padding:0 4px;border-radius:999px;background:rgba(255,255,255,.8);color:#1C1400;font-size:.88em;font-weight:800}
.alert-badge.red .atag{color:#7F1D1D}
.alert-badge.notify .atag.n,.alert-badge.temp .atag.t{display:inline}
.alert-badge.temp,.bar > .alert-badge.at-today.temp{animation:none!important;background:#F59E0B!important;border-color:#B45309!important;color:#1C1400!important;box-shadow:0 0 0 1px rgba(180,83,9,.35)!important}
.tip-alert[data-alert-act]{cursor:pointer;position:relative;padding-right:16px}
.tip-act{position:absolute;right:4px;top:0;font-weight:800;opacity:.7}
.tip-atag{display:inline-block;margin-left:4px;padding:0 5px;border-radius:999px;background:#fff;font-size:11px}
.tip-atag.temp{background:#F59E0B;color:#1C1400}
#alert-act{position:fixed;inset:0;z-index:10002;display:flex;align-items:flex-end;justify-content:center;background:rgba(17,24,39,.38)}
#alert-act[hidden]{display:none}
#alert-act .aa-box{width:min(440px,100%);box-sizing:border-box;background:#fff;color:#111827;border-radius:16px 16px 0 0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -4px 22px rgba(0,0,0,.22);font:14px/1.3 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;max-height:92dvh;overflow:auto}
.aa-h{font-weight:800;font-size:16px;display:flex;align-items:center;gap:6px}
.aa-h .lv{width:10px;height:10px;border-radius:999px;background:#FACC15;flex-shrink:0}.aa-h .lv.red{background:#DC2626}
.aa-s{color:#4B5563;font-size:12.5px;margin:3px 0 6px}
.aa-o{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;border-top:1px solid #F1F2F4;cursor:pointer;user-select:none;-webkit-user-select:none}
.aa-o input{width:20px;height:20px;margin:0;flex-shrink:0;accent-color:#007AFF}
.aa-tr{padding:0 2px 4px 32px}
.aa-ctx{font-size:12px;color:#6B7280;margin:0 0 4px}
#aa-text{display:block;width:100%;min-height:74px;box-sizing:border-box;border:1px solid #D1D5DB;border-radius:8px;padding:7px 8px;font:14px/1.35 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#111827;resize:vertical}
#aa-text::placeholder{color:#9CA3AF}
.aa-hint{font-size:11.5px;color:#6B7280;margin-top:4px}
.aa-nh{margin:-4px 0 4px 32px;font-size:11.5px;color:#B91C1C;font-weight:600}.aa-nh[hidden]{display:none}
#alert-toast button[data-alert-more]{color:#FCA5A5}

.aa-b{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;border-top:1px solid #F1F2F4;padding-top:10px}
.aa-b button{height:38px;padding:0 20px;border-radius:999px;border:0;font:700 14px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;cursor:pointer}
.aa-ok{background:#007AFF;color:#fff}.aa-cancel{background:#F3F4F6;color:#111827}
/* over other text: stay opaque, pulse colour + glow instead of fading (readable at every frame) */
.bar > .alert-badge.at-today{animation-name:alertFlashSolid;--bg1:#FACC15;--bg2:#FEF3C7}
.bar > .alert-badge.at-today.red{--bg1:#DC2626;--bg2:#F87171}
@keyframes alertFlashSolid{from{background:var(--bg1);box-shadow:0 0 0 2px var(--glow),0 0 9px var(--glow)}to{background:var(--bg2);box-shadow:0 0 0 0 transparent}}
.uk-row.has-alert{flex-wrap:wrap;row-gap:0}
#uk-alerts{flex-shrink:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:4px 6px 3px;max-height:104px;overflow-y:auto}
#uk-wrap.tucked #uk-alerts{display:none}
#uk-alerts>div{max-width:100%}
#uk-alerts>div:not(:has(.alert-badge:not(.off))){display:none}
#uk-alerts:not(:has(.alert-badge:not(.off))){display:none}
#uk-alerts .alert-badge{height:auto;min-height:20px;max-width:100%;padding:2px 8px;font-size:11.5px;line-height:1.2;white-space:normal;text-align:center;justify-content:center}
.tip-orig,.aa-orig{display:block;color:#6B7280;font-style:italic;font-size:.92em}
.uk-row.has-alert .nm{flex:0 1 auto}
.alert-mini{color:#A16207;font-weight:800;margin-right:1px}
.alert-mini.red{color:#DC2626}
@keyframes alertFlash{from{opacity:1;box-shadow:0 0 0 2px var(--glow),0 0 9px var(--glow)}to{opacity:.3;box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion: reduce){.alert-badge{animation:none;box-shadow:0 0 0 2px var(--glow),0 0 7px var(--glow)}}
.tip-alert{font-weight:700;color:#854D0E;background:#FEF3C7;padding:1px 6px;margin:3px -4px 0;border-radius:6px 6px 0 0}
.tip-alert.red{color:#B91C1C;background:#FEE2E2}
.tip-alert-note{color:#374151;background:#FEF3C7;padding:1px 6px;margin:0 -4px 3px;border-radius:0 0 6px 6px}
.tip-alert-note.red{background:#FEE2E2}
/* t199u Zprávy */

[data-lb]{cursor:pointer}

function barAt(x,y){
  // t240u/t262u: hit-test the painted pill first (first–last pixel, full visual height),
  // then the .bar box, then a small slop. Same-day neighbours split at their visual gap,
  // so slop never crosses the turnover boundary into the other stay.

  const boxes=bars.map(b=>{

  // Horizontal clamp: do not let slop cross the visual boundary with a same-row neighbour.
  const edge=(o,side)=>{
    let lim=side<0?o.r.left-8:o.r.right+8;
    for(const q of boxes){
      if(q.b===o.b) continue;
      if(Math.abs(q.midY-o.midY)>12) continue;
      if(side>0&&q.r.left>=o.r.right-1&&q.r.left<o.r.right+24) lim=Math.min(lim,(o.r.right+q.r.left)/2);

function ecFeeDraft(code,time){
  const listing=stayListing(code), name=stayGuest(code), house=isHouse(listing);
  let lang=(stayGuestLang(code)||"en").toLowerCase();
  if(lang==="ukr"||lang==="ua")lang="uk"; if(lang==="cz"||lang==="ces")lang="cs";
  const pack=EC_FEE_DRAFT[lang]||EC_FEE_DRAFT.en;
  const sign=(house?EC_SIGN_HOUSE:EC_SIGN_BOAT)[lang]||(house?EC_SIGN_HOUSE.en:EC_SIGN_BOAT.en);
  const tmpl=house?pack.house:pack.boat;
  return tmpl.replace("{n}",name||"").replace("{t}",time).replace("{h}",String(ecHours(time))).replace("{eur}",String(ecFee(time))).replace("{sign}",sign);
}
function ecPayUrl(code){return "https://www.airbnb.com/hosting/reservations/details/"+String(code||"").toUpperCase()}
(function(){
  const sh=document.createElement("div");sh.id="ec-ap";sh.hidden=true;sh.setAttribute("role","dialog");sh.setAttribute("aria-modal","true");document.body.appendChild(sh);

  function readWheel(){
    const w=sh.querySelector(".wheel");if(!w)return sel;
    const mid=w.getBoundingClientRect().top+w.clientHeight/2;
    let best=sel,bd=1e9;
    w.querySelectorAll(".slot").forEach(el=>{const r=el.getBoundingClientRect(),d=Math.abs((r.top+r.bottom)/2-mid);if(d<bd){bd=d;best=el.dataset.t}});

    sh.hidden=false;

  const close=()=>{sh.hidden=true;sh.innerHTML="";cur=null;mode="pick"};
  async function confirm(){

    async function write(){
      if(!SB_ON){return "local"}

      const key=ecKey(code)+"|"+sel, old=[];
      for(const k in ALERT_SH){if(k===ecKey(code)||(k.startsWith(ecKey(code)+"|")&&k!==key))old.push(k)}
      let r=null;try{r=await sbRpc("set_alert_action",{p_pin:pin,p_code:key,p_state:"solved",p_note:sel,p_by_name:nameGet()||null})}catch(_){r=null}

      ALERT_SH[key]={s:"solved",t:Math.max(Date.now(),Date.parse(r.at)||0),by:nameGet()||""};
      for(const k of old){try{await sbRpc("set_alert_action",{p_pin:pin,p_code:k,p_state:"",p_note:null,p_by_name:nameGet()||null})}catch(_){}
        ALERT_SH[k]={s:"",t:Date.now(),by:nameGet()||""}}

  function ensureUser(){const n=nameGet();return n?Promise.resolve(n):askUser()}

  const PERSON=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.25"/><path d="M5.4 19.2c.85-3.15 3.4-5 6.6-5s5.75 1.85 6.6 5"/></svg>`;
  let panel=null, z=1, poll=0;

  function setOpen(on){
    if(!panel && on)mount();
    if(!panel)return;
    panel.hidden=!on;z=1;applyZ();

  window.openLoginLog=function(on){mount();setOpen(on!==false)};
  function applyZ(){if(!panel)return;const box=panel.querySelector(".ll-zoom");if(box)box.style.transform=Math.abs(z-1)<.01?"":`scale(${z})`}
  function bindZoom(el){
    let pin=null, lastTap=0;
    const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
    el.addEventListener("touchstart",e=>{if(e.touches.length!==2)return;e.preventDefault();pin={d0:dist(e.touches),z0:z}},{passive:false});
    el.addEventListener("touchmove",e=>{if(!pin||e.touches.length<2)return;e.preventDefault();z=Math.min(LL_ZMAX,Math.max(LL_ZMIN,pin.z0*dist(e.touches)/pin.d0));applyZ()},{passive:false});
    const end=()=>{pin=null};el.addEventListener("touchend",end);el.addEventListener("touchcancel",end);
    el.addEventListener("wheel",e=>{if(!(e.ctrlKey||e.metaKey))return;e.preventDefault();const dy=e.deltaY*(e.deltaMode===1?16:1);z=Math.min(LL_ZMAX,Math.max(LL_ZMIN,z*Math.exp(-dy*.01)));applyZ()},{passive:false});
    el.addEventListener("click",e=>{const t=Date.now();if(t-lastTap<320){z=1;applyZ();lastTap=0}else lastTap=t});
  }
  async function load(){
    if(!panel||panel.hidden)return;
    const body=panel.querySelector(".ll-body"), you=panel.querySelector("[data-ll-you]"), allow=panel.querySelector("[data-ll-allow]");
    if(you)you.textContent=nameGet()?T("login_you",nameGet()):"";
    if(!SB_ON){body.innerHTML=`<div class="ll-err">${esc(T("login_err"))}</div>`;return}
    try{
      if(typeof fetchBell==="function")await fetchBell();
      const r=await sbRpc("get_app_logins",{p_limit:200});
      if(!r||!r.ok){body.innerHTML=`<div class="ll-err">${esc(T("login_err"))}</div>`;return}
      const fromBell=(window.BELL&&window.BELL.users)||[];
      const merged=uniqueLogins([...(r.items||[]).map(it=>({name:it.username,at:it.at})),...fromBell]);
      // if get_bell_holder provided has_sub, copy it over
      for(const u of merged){const f=fromBell.find(x=>String(x.name||"").toLowerCase()===u.name.toLowerCase());if(f)u.has_sub=!!f.has_sub}
      const holder=((window.BELL&&window.BELL.name)||"").toLowerCase();

      }).join(""):`<div class="ll-empty">${esc(T("login_empty"))}</div>`;
      const chip=panel.querySelector("[data-push-bell]"), hn=panel.querySelector("[data-ll-holder]");
      if(hn)hn.textContent=(window.BELL&&window.BELL.name)||"";
      if(chip){const lab=((window.BELL&&window.BELL.name)?T("bell_held",window.BELL.name):T("bell_none"));chip.title=lab;chip.setAttribute("aria-label",lab);chip.classList.toggle("you",!!(holder&&me&&holder===me))}
      if(allow){const sub=typeof pushSub==="function"?await pushSub():null;allow.hidden=!!sub}
    }catch(_){body.innerHTML=`<div class="ll-err">${esc(T("login_err"))}</div>`}
  }
  window.paintLoginLog=()=>{if(panel&&!panel.hidden)load()};
  function mount(){
    if(panel)return panel;
    panel=document.createElement("div");panel.id="login-log";panel.hidden=true;
    panel.setAttribute("role","dialog");panel.setAttribute("aria-label",T("login_title"));
    panel.innerHTML=`<div class="ll-zoom"><div class="ll-bar"><b>${esc(T("login_title"))}</b><button type="button" id="ll-bell" class="ms-bell" data-push-bell title="${esc(T("bell_none"))}" aria-label="${esc(T("bell_none"))}"><span aria-hidden="true">🔔</span></button><button type="button" data-ll-x aria-label="${esc(T("login_close"))}">✕</button></div><div class="ll-body"></div><div class="ll-foot"><div class="ll-you" data-ll-you></div><button type="button" class="ll-allow" data-ll-allow hidden>${esc(T("bell_allow"))}</button><button type="button" class="ll-out" data-ll-out>${esc(T("login_out"))}</button></div></div>`;
    document.body.appendChild(panel);
    bindZoom(panel);
    panel.querySelector("[data-ll-x]").addEventListener("click",()=>setOpen(false));
    panel.querySelector("[data-ll-out]").addEventListener("click",()=>{setOpen(false);nameSet("");try{Object.keys(localStorage).forEach(k=>{if(k.startsWith("appLoginAt|"))localStorage.removeItem(k)})}catch(_){}askUser()});
    panel.querySelector("[data-ll-allow]").addEventListener("click",e=>{e.preventDefault();enableThisPhonePush().then(()=>load())});
    panel.addEventListener("click",e=>{
      if(window.__bellDrag)return;
      const row=e.target.closest&&e.target.closest(".ll-row[data-ll-name]");
      if(!row||e.target.closest("[data-ll-bell],[data-push-bell]"))return;
      const name=row.dataset.llName;if(name)passBellTo(name);
    });
    return panel;
  }
  document.addEventListener("click",e=>{
    const b=e.target.closest&&e.target.closest("#login-btn");
    if(b){e.preventDefault();mount();setOpen(panel.hidden);return}
    if(panel&&!panel.hidden&&!window.__bellDrag&&!e.target.closest("#login-log,#user-login,#tech-pin,#bell-ask,#bell-ghost,#push-bell,[data-push-bell]"))setOpen(false);
  });
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&panel&&!panel.hidden){setOpen(false)}});
  ensureUser().then(n=>{if(n)recordAppLogin(false)});
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&nameGet())recordAppLogin(false)});
})();

const pkStay=code=>((window.DATA&&window.DATA.R)||[]).find(x=>x[0]===code)||[];
const pkHouse=l=>/vavrinec|vavřinec|podkozi|podkoží|dafni|lake\s*house/i.test(String(l||""));
function parkDraft(code,force){
  const r=pkStay(code),listing=r[1]||"",name=String(r[2]||"").split(" ")[0],house=pkHouse(listing);
  let lang=force||"en";if(!force)try{lang=(window.guestLangForCode&&window.guestLangForCode(code))||"en"}catch(_){}
  lang=String(lang).toLowerCase();if(lang==="ukr"||lang==="ua")lang="uk"; if(lang==="cz"||lang==="ces")lang="cs";
  const pack=PK_PARK_DRAFT[lang]||PK_PARK_DRAFT.en;
  const sign=(house?PK_SIGN_HOUSE:PK_SIGN_BOAT)[lang]||(house?PK_SIGN_HOUSE.en:PK_SIGN_BOAT.en);
  return (house?pack.house:pack.boat).replace("{n}",name||"").replace(" ,",",").replace(" !","!").replace("{sign}",sign);
}
(function(){
  const PZMIN=1,PZMAX=1.2;
  const w=document.createElement("div");w.id="pk-act";w.hidden=true;w.setAttribute("role","dialog");w.setAttribute("aria-modal","true");document.body.appendChild(w);
  let z=1;try{const v=parseFloat(localStorage.getItem("pkActZoom"));if(v>0)z=Math.min(PZMAX,Math.max(PZMIN,v))}catch(_){}
  const apZ=()=>{const b=w.querySelector(".pa-box");if(b)b.style.setProperty("--paz",String(z))};
  const setZ=v=>{z=Math.min(PZMAX,Math.max(PZMIN,v));apZ();try{localStorage.setItem("pkActZoom",String(Math.round(z*1000)/1000))}catch(_){}};
  let pin=null;const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  w.addEventListener("touchstart",e=>{if(e.touches.length===2){e.preventDefault();pin={d:dist(e.touches),z}}},{passive:false});
  w.addEventListener("touchmove",e=>{if(pin&&e.touches.length>=2){e.preventDefault();setZ(pin.z*dist(e.touches)/pin.d)}},{passive:false});
  w.addEventListener("touchend",e=>{if(e.touches.length<2)pin=null});
  w.addEventListener("wheel",e=>{if(!e.ctrlKey)return;e.preventDefault();setZ(z*Math.exp(-Math.max(-40,Math.min(40,e.deltaY))*.01))},{passive:false});
  let cur=null;
  const close=()=>{w.hidden=true;w.innerHTML="";cur=null};
  const smsHref=(ph,txt)=>"sms:"+(ph?String(ph).replace(/[^\d+]/g,""):"")+"?&body="+encodeURIComponent(txt);
  // t297u: the SMS button fetches THIS stay's number on demand (PIN-gated RPC get_guest_phone; inbox _meta.phone as
  // fallback until supabase_patch_t297.sql is applied). The number lives only in this sheet's memory, never stored/logged.
  const phSt=(k,extra)=>{const el=w.querySelector("[data-pa-ph]");if(el){el.dataset.paPh=k;el.textContent=T("pk_ph_"+k)+(extra?" "+extra:"")}};
  async function fetchPhone(code,ask){
    let pin=pinGet();
    if(!pin){if(!ask)return {st:"nopin"};w.hidden=true;pin=await askPin(T("pk_need_pin"));w.hidden=false;if(!pin)return {st:"nopin"}}
    let r=null;
    if(SB_ON){try{r=await sbRpc("get_guest_phone",{p_pin:pin,p_code:code})}catch(_){r=null}}
    if(r&&r.ok===false){if(r.error==="pin_invalid"||r.error==="pin_not_set")pinSet("");return {st:"err",err:sbErr(r.error)}}
    const fb=(window.guestPhoneForCode&&window.guestPhoneForCode(code))||"";
    const ph=(r&&r.ok&&r.phone)||fb;
    return {st:ph?"ok":"none",phone:ph,lang:r&&r.ok?r.lang:null,rpc:!!(r&&r.ok)};
  }
  function applyPhone(res){
    if(!cur)return;cur.res=res;const sm=w.querySelector("[data-pa-sms]"),ta=w.querySelector("[data-pa-txt]");
    if(res.lang&&!cur.edited){const t=parkDraft(cur.code,res.lang);if(t&&ta)ta.value=t}
    if(sm){sm.href=smsHref(res.phone||"",ta?ta.value:"");sm.dataset.hasPhone=res.phone?"1":"0"}
    phSt(res.st,res.st==="err"?res.err:"");
  }
  function open(code,plate){
    const r0=pkStay(code),listing=r0[1]||"",guest=r0[2]||"";
    const txt=parkDraft(code);
    const ab=window.abHrefForCode?window.abHrefForCode(code):{href:"https://www.airbnb.com/hosting/reservations/details/"+String(code||"").toUpperCase(),kind:"res"};
    cur={code,edited:false,res:null,busy:null};
    w.innerHTML=`<div class="pa-box" data-pk-act="${esc(code)}"><div class="pa-h"><b>🚗 <span>${esc(String(plate||"").toUpperCase())}</span> · ${esc(guest)} · ${esc(listing)}</b><button type="button" data-pa-x2 aria-label="${esc(T("pk_close"))}">✕</button></div>
<div class="pa-s">${esc(T("pk_sub"))}</div><textarea data-pa-txt aria-label="${esc(T("pk_txt"))}">${esc(txt)}</textarea>
<div class="pa-ph" data-pa-ph="wait">${esc(T("pk_ph_wait"))}</div>
<div class="pa-b"><a data-pa-sms href="${esc(smsHref("",txt))}" data-has-phone="0">${esc(T("pk_sms"))}</a><a data-pa-ab href="${esc(ab.href)}" target="_blank" rel="noopener" data-ab-kind="${esc(ab.kind)}">${esc(T("pk_ab"))}</a><button type="button" data-pa-x>${esc(T("pk_close"))}</button></div>
<small>${esc(T("pk_note"))}</small></div>`;
    w.hidden=false;apZ();
    const ta=w.querySelector("[data-pa-txt]"),sm=w.querySelector("[data-pa-sms]");
    ta.addEventListener("input",()=>{if(cur)cur.edited=true;sm.href=smsHref((cur&&cur.res&&cur.res.phone)||"",ta.value)});
    // prefetch when the device already has the PIN, so the SMS tap opens the number directly
    const me=cur;me.busy=fetchPhone(code,false).then(res=>{if(cur===me){if(res.st==="nopin")phSt("nopin");else applyPhone(res)}return res});
  }
  async function smsTap(){
    const me=cur;if(!me)return;
    let res=me.res||(me.busy&&await me.busy);
    if(!res||res.st==="nopin"||res.st==="err"){phSt("wait");res=await fetchPhone(me.code,true);if(cur!==me)return;applyPhone(res)}
    const ta=w.querySelector("[data-pa-txt]");const href=smsHref((res&&res.phone)||"",ta?ta.value:"");
    copyTxtG(ta?ta.value:"");location.href=href;
  }
  w.addEventListener("click",e=>{
    if(e.target===w||e.target.closest("[data-pa-x],[data-pa-x2]")){close();return}
    const ta=w.querySelector("[data-pa-txt]");
    if(e.target.closest("[data-pa-sms]")){if(cur&&cur.res&&cur.res.st!=="nopin"&&cur.res.st!=="err"){copyTxtG(ta.value);return}e.preventDefault();smsTap();return}
    const a=e.target.closest("[data-pa-ab]");if(a){copyTxtG(ta.value);a.textContent="✓ "+T("sms_copied");return}
  });
  async function copyTxtG(txt){try{await navigator.clipboard.writeText(txt)}catch(_){try{const t=document.createElement("textarea");t.value=txt;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}catch(_){}}}
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!w.hidden)close()});
  function pkToast(){
    let el=document.getElementById("pk-toast");
    if(!el){el=document.createElement("div");el.id="pk-toast";el.setAttribute("role","status");document.body.appendChild(el)}
    el.textContent=T("pk_copied");el.hidden=false;
    clearTimeout(pkToast._tm);pkToast._tm=setTimeout(()=>{el.hidden=true},2200);
  }
  // t300u: tap the plate → existing SMS/Airbnb sheet. Tap the rest of the row (name, bar, listing…)
  // copies the parking-rules draft and opens the Airbnb conversation. Never auto-sends.
  async function openAirbnbPark(code){
    const txt=parkDraft(code);
    const ab=window.abHrefForCode?window.abHrefForCode(code):{href:"https://www.airbnb.com/hosting/reservations/details/"+String(code||"").toUpperCase()};
    await copyTxtG(txt);
    pkToast();
    const a=document.createElement("a");a.href=ab.href;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();
  }
  document.addEventListener("click",e=>{
    const pl=e.target.closest&&e.target.closest("#park-panel .pstay .pl");
    if(pl){const row=pl.closest("[data-park-stay]");if(!row)return;e.preventDefault();e.stopPropagation();open(row.dataset.parkStay,pl.textContent.trim());return}
    const row=e.target.closest&&e.target.closest("#park-panel .pstay");
    if(!row||!row.dataset.parkStay)return;
    e.preventDefault();e.stopPropagation();
    openAirbnbPark(row.dataset.parkStay);
  },true);
  window.parkActOpen=open;
  window.openAirbnbPark=openAirbnbPark;
})();

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
})();
