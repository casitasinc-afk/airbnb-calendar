<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7EBEE0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calendar">
<title>Airbnb Calendar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#ffffff; --bg-subtle:#f5f7f9; --accent-subtle:#e6f2fa; --row-even:#ffffff; --row-odd:#f0f7fb;
  --b-default:#dde2e7; --b-subtle:#eceff2; --b-strong:#b9c1c9;
  --t1:#1b2229; --t2:#4b5763; --t3:#7d8893; --accent:#1f78b4;
  --day-w:46px; --row-h:22px; --name-w:138px; --head-h:36px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
#app{height:100dvh;min-height:100dvh;width:100%;padding:4px;padding-top:max(4px,env(safe-area-inset-top));padding-bottom:calc(max(4px,env(safe-area-inset-bottom)) + 38px);display:flex;flex-direction:column;gap:2px;overflow:hidden}
#meta{font-size:11px;line-height:1.2;color:var(--t3);padding:0 2px;display:flex;align-items:center;gap:6px;position:relative;flex-shrink:0;z-index:8}
#meta .meta-l{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#search-btn{flex-shrink:0;width:24px;height:24px;border:0;background:transparent;color:var(--t2);padding:0;display:flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer}
#search-btn:hover,#search-btn[aria-expanded="true"]{background:var(--accent-subtle);color:var(--accent)}
#search-panel{display:none;position:absolute;top:calc(100% + 2px);right:0;width:min(280px,calc(100vw - 16px));background:var(--bg);border:1px solid var(--b-default);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.12);padding:6px;z-index:20}
#search-panel.open{display:block}
#search-q{width:100%;font-size:14px;padding:6px 8px;border:1px solid var(--b-default);border-radius:6px;outline:none;color:var(--t1);background:var(--bg)}
#search-q:focus{border-color:var(--accent)}
#search-hits{margin-top:4px;max-height:220px;overflow-y:auto}
#search-hits button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12px;line-height:1.3;color:var(--t1)}
#search-hits button:hover,#search-hits button:focus,#search-hits button.on{background:var(--accent-subtle)}
#search-hits .who{font-weight:600}
#search-hits .sub{color:var(--t3);font-size:11px}
#search-hits .empty{padding:8px;color:var(--t3);font-size:12px}
.bar.hit{z-index:7}
.bar.hit .bar-inner{box-shadow:0 0 0 2px #1F78B4,0 0 8px rgba(31,120,180,.55)}
#shell{display:flex;flex:0 1 auto;min-height:120px;border:1px solid var(--b-default);border-radius:8px;overflow-x:hidden;overflow-y:auto;background:var(--bg);user-select:none;-webkit-user-select:none;align-items:flex-start}
#names{width:var(--name-w);flex-shrink:0;border-right:1px solid var(--b-default);background:var(--bg);z-index:2}
.nhead{height:calc(var(--head-h) + 14px);border-bottom:1px solid var(--b-default);display:flex;align-items:flex-end;padding:0 8px 4px;font-size:12px;font-weight:500;color:var(--t3)}
.nrow{height:var(--row-h);display:flex;align-items:center;gap:4px;padding:0 6px;border-bottom:1px solid var(--b-subtle);background:var(--row-even)}
.nrow.odd{background:var(--row-odd)}
.nrow span{font-size:13px;font-weight:500;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.divider{height:0;border-top:1px dashed var(--b-strong)}
#scroller{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;cursor:grab;touch-action:pan-x pan-y;scrollbar-width:thin}
#scroller.dragging{cursor:grabbing}
#grid{position:relative}
.months{height:14px;display:flex;border-bottom:1px solid var(--b-subtle);background:var(--bg)}
.month{flex-shrink:0;padding-left:0;font-size:11px;font-weight:600;color:var(--t2);display:flex;align-items:center;border-right:1px solid var(--b-subtle);white-space:nowrap}
.month .ml{position:sticky;left:6px}
.days{height:calc(var(--head-h) - 14px);display:flex;border-bottom:1px solid var(--b-default)}
.day{width:var(--day-w);flex-shrink:0;border-right:1px solid var(--b-subtle);display:flex;flex-direction:column;align-items:center;justify-content:center}
.day .wd{font-size:10px;color:var(--t3);line-height:1.1}
.day .dn{font-size:12px;font-weight:500;color:var(--t1);line-height:1.2}
.day.we .dn{color:var(--t2)}
.day.today{background:var(--accent-subtle)}
.day.today .wd,.day.today .dn{color:var(--accent)}
.day.today .dn{font-weight:600}
#body{position:relative}
.cols{position:absolute;inset:0;display:flex;pointer-events:none;z-index:1}
.col{width:var(--day-w);flex-shrink:0;height:100%;border-right:1px solid var(--b-subtle)}
.col.we{background:transparent}
.col.today{background:transparent}
/* Body day washes were opaque and hid row stripes in today (and weekends).
   Header .day.today keeps accent; top triangles mark today/tomorrow. */
.row{position:absolute;left:0;height:var(--row-h);border-bottom:1px solid var(--b-subtle);z-index:2}
.row.div{border-top:1px dashed var(--b-strong)}
.stripes{position:absolute;inset:0;pointer-events:none;z-index:0}
.stripe{position:absolute;left:0;height:var(--row-h);background:var(--row-even)}
.stripe.odd{background:var(--row-odd)}
.bar{position:absolute;top:calc((var(--row-h) - 32px)/2);height:32px;width:auto;display:flex;align-items:center;padding:0;overflow:visible;background:transparent;border-radius:0;box-shadow:none;z-index:3;cursor:pointer;pointer-events:auto}
.bar-inner{width:100%;height:calc(var(--row-h) - 4px);border-radius:999px;color:#1E3A4C;display:flex;align-items:center;flex-wrap:nowrap;gap:2px;padding:0 4px;overflow:hidden;white-space:nowrap;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);pointer-events:none}
.bar .n,.bar .heads,.bar .g,.bar .car,.bar svg,.bar-inner,.bar-inner *{pointer-events:none}
.bar .n{font-size:12px;font-weight:700;line-height:1;letter-spacing:-.02em;flex-shrink:0}
.bar .heads{display:inline-flex;gap:0;flex-shrink:0;align-items:center;margin-left:0}
.bar .heads svg,.bar .car{flex-shrink:0;display:block}
.bar .g{font-size:11px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:2px;flex:1 1 auto;min-width:0}
.dmark{position:absolute;top:0;height:9px;width:var(--day-w);pointer-events:none;z-index:4;clip-path:polygon(0 0,100% 0,50% 100%)}
.dmark.t{background:#000}
.dmark.m{background:rgba(0,0,0,.45)}
/* Today turnover zones + live now line (Europe/Prague; checkout 10 / check-in 15). */
.tzones{position:absolute;top:0;height:100%;display:flex;pointer-events:none;z-index:1}
.tzones *,.tzone-pre,.tzone-clean,.tzone-in{pointer-events:none}
.tzone-pre{height:100%;background:rgba(255,56,92,.05)}
.tzone-clean{height:100%;background:rgba(180,160,40,.10)}
.tzone-in{height:100%;background:rgba(31,120,180,.07)}
.nowline{position:absolute;top:0;width:2px;height:100%;background:#FF385C;box-shadow:0 0 0 1px rgba(255,255,255,.55);pointer-events:none;z-index:6}
.nowline.head{top:14px;height:calc(var(--head-h) - 14px);box-shadow:none;z-index:5}

#uklidy{flex-shrink:0;display:flex;gap:4px;padding-top:3px;border-top:1px solid var(--b-subtle);max-height:34dvh;min-height:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-x}
.uk-col{flex:0 0 118px;width:118px;min-width:118px;display:flex;flex-direction:column;gap:1px;overflow:hidden;box-sizing:border-box;position:relative}
.uk-col.muted{opacity:.92}
.uk-mark{width:100%;height:8px;flex-shrink:0;pointer-events:none;clip-path:polygon(0 0,100% 0,50% 100%)}
.uk-mark.t{background:#000}
.uk-mark.m{background:rgba(0,0,0,.45)}
.uk-col.muted .uk-h,.uk-col.muted .uk-sub,.uk-col.muted .uk-row .nm,.uk-col.muted .uk-empty{color:var(--t3)}
.uk-h{font-size:11px;font-weight:600;color:var(--t2);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uk-list{overflow-y:auto;min-height:0;flex:1}
.uk-sub{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.04em;line-height:1.2;margin-top:1px}
.uk-rule{border-top:1px solid var(--b-default);margin:3px 0 2px}
.uk-row{display:flex;align-items:center;gap:3px;padding:0;min-width:0;min-height:22px;line-height:1.25;cursor:pointer;pointer-events:auto}
.uk-row > *{pointer-events:none}
.uk-sec{border-radius:4px;padding:1px 3px 2px}
.uk-sec.out{background:rgba(255,56,92,.08)}
.uk-sec.in{background:rgba(40,160,80,.08)}
.lm-pill,.uk-row .lm{display:inline-block;min-width:13px;height:13px;border-radius:999px;background:#E11D48;color:#FFFFFF;font-size:10px;font-weight:800;line-height:13px;text-align:center;flex-shrink:0}
.bar .lm{flex-shrink:0;width:12px;height:12px;border-radius:999px;background:#E11D48;color:#fff;font-size:10px;font-weight:800;line-height:12px;text-align:center}
.tip-lm{color:#BE123C;font-weight:700;display:flex;align-items:center;gap:4px}
.uk-row .nm{font-size:11px;font-weight:500;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.uk-empty{font-size:11px;color:var(--t3)}
/* Parking button + slide-out panel (12 angled spots) */
#park-btn{position:fixed;left:6px;bottom:max(4px,env(safe-area-inset-bottom));width:34px;height:34px;border-radius:999px;border:1px solid #D1D5DB;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;z-index:9000}
#park-btn span{width:22px;height:22px;border-radius:4px;background:#1D4ED8;color:#fff;font-weight:800;font-size:16px;line-height:22px;text-align:center}
#park-count{position:fixed;left:46px;bottom:calc(max(4px,env(safe-area-inset-bottom)) + 6px);height:22px;line-height:22px;padding:0 10px;border-radius:999px;background:#F3F4F6;border:1px solid #D1D5DB;color:#111827;font-size:12px;font-weight:600;white-space:nowrap;z-index:9000;pointer-events:auto;cursor:pointer;font-family:inherit;margin:0}
#park-panel{position:fixed;left:4px;bottom:calc(max(4px,env(safe-area-inset-bottom)) + 40px);width:min(420px,calc(100vw - 8px));box-sizing:border-box;background:#fff;color:#111827;border:1px solid #D1D5DB;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.22);padding:8px 10px 10px;z-index:9001;transform:translateX(calc(-100% - 12px));opacity:0;transition:transform 220ms ease-out,opacity 220ms ease-out;pointer-events:none}
#park-panel.open{transform:translateX(0);opacity:1;pointer-events:auto}
#park-panel .ph{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:4px;font-weight:700;font-size:13px}
#park-panel .pbar{height:6px;border-radius:999px;background:#E5E7EB;overflow:hidden;margin-bottom:6px}
#park-panel .pbar div{height:100%}
#park-panel .plist{font-size:11px;color:#374151;margin-top:6px;line-height:1.35}
#park-panel .pnote{font-size:11px;color:#4B5563;margin-top:2px}
#park-panel .ptabs{display:inline-flex;background:#E5E7EB;border-radius:8px;padding:2px;gap:2px}
#park-panel .ptabs button{border:0;border-radius:6px;padding:2px 10px;font-size:12px;font-weight:600;cursor:pointer;background:transparent;color:#111827}
#park-panel .ptabs button[aria-selected="true"]{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.18)}
#park-panel .psum{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-bottom:4px}
#park-panel .psum b{font-size:13px}
#park-panel .psum span{font-size:12px;color:#374151}
#park-panel .povr{font-size:11px;font-weight:700;color:#fff;background:#BE123C;border-radius:999px;padding:0 7px;line-height:16px}
#park-panel .pstays{margin-top:4px;max-height:150px;overflow-y:auto;font-size:12px;line-height:1.45}
#park-panel .pstay{display:flex;gap:6px;align-items:center;color:#111827}
#park-panel .pstay.ov{color:#BE123C}
#park-panel .pstay .no{width:18px;text-align:right;color:#4B5563;font-variant-numeric:tabular-nums}
#park-panel .pstay .ls{font-weight:600}
#park-panel .pstay .gs{color:#374151}
#park-panel .pstay .pl{display:inline-flex;align-items:center;gap:3px;font-weight:700}
#park-panel .pstay .np{color:#4B5563;font-style:italic}
#park-panel .pover{font-size:11px;color:#BE123C;font-weight:700;margin-top:2px}
#tip{position:fixed;display:none;z-index:10000;max-width:min(280px,calc(100vw - 16px));background:#FFFFFF;color:#111827;border:1px solid #D1D5DB;font-size:12px;line-height:1.35;padding:8px 10px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.22);pointer-events:auto}
#tip .tip-name{font-weight:700;font-size:13px}
#tip .tip-listing{font-weight:600;color:#374151}
#tip .tip-muted{color:#4B5563;font-size:11px}
#tip .tip-tr{font-weight:600;display:flex;align-items:center;gap:5px}
.bar svg.tr{flex-shrink:0}
#tip .tip-car{font-weight:700;display:flex;align-items:center;gap:5px}
.uk-row .carf{flex-shrink:0}
.pdays{height:14px;display:flex;border-bottom:1px solid var(--b-subtle);background:var(--bg)}
.pday{width:var(--day-w);flex-shrink:0;border-right:1px solid var(--b-subtle);display:flex;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.pday > *{pointer-events:none}
.pday .pp{width:10px;height:10px;border-radius:2px;color:#FFFFFF;font:800 8px/10px system-ui,sans-serif;text-align:center;background:#64748B}
.pday.amber .pp{background:#B45309}
.pday.red .pp{background:#BE123C}
.pday .pn{font-size:9px;font-weight:600;color:var(--t2);line-height:10px}

@keyframes offlineFlash{0%,100%{opacity:1}50%{opacity:.22}}
#meta .online{color:#1B7A3D;font-weight:600}
#meta .lg{margin-left:6px;display:inline-flex;gap:3px;vertical-align:middle}
#meta .lg i{font-style:normal;font-size:9px;line-height:12px;padding:0 4px;border-radius:999px;color:#1E3A4C}
#meta .lg i.d{border:1px dashed rgba(30,58,76,.6);line-height:10px}
.bar.judged .bar-inner{border:1.5px dashed rgba(30,58,76,.55)}
.bar.judged.cp .bar-inner{border-color:#B3261E}
#meta .offline{color:#C62828;font-weight:700;animation:offlineFlash 1.1s ease-in-out infinite}

.nrow.turn span{font-weight:600}
.uk-row.turn span{font-weight:600}
.uk-col .nowline{z-index:6}
</style>
</head>
<body>
<div id="app">
  <div id="meta"></div>
  <div id="shell">
    <div id="names"></div>
    <div id="scroller"><div id="grid"></div></div>
  </div>
  <div id="uklidy"></div>
</div>
<div id="tip"></div>
<button type="button" id="park-btn" aria-label="Parking" aria-expanded="false"><span>P</span></button><button type="button" id="park-count" aria-label="Parking tonight"></button>
<div id="park-panel" role="dialog" aria-label="Parking" aria-hidden="true"></div>
<script src="data.js"></script>
<script>
(function(){
const DAY_W=46, ROW_H=22, HEAD_H=36;
const CHECKOUT_H=10, CHECKIN_H=15; // Europe/Prague turnover clock
const WEEKDAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const STAY_BAR="#A9B4C0"; // neutral slate = no rating / no messages
// Guest-quality colors (guest_ratings.json → D.Q[code]=[tier,reviews,note]); r* rating tiers, c* judged from messages (dashed)
const TIER_BG={r5:"#9ED9A8",r49:"#C8E6B0",r48:"#E4EC9E",r47:"#F6DA8A",r46:"#F6C0B3",r45:"#EFA294",r44:"#E3857A",cf:"#C8E6B0",cu:"#F6DA8A",cp:"#F2A99C",n:STAY_BAR};
const TIER_LABEL={r5:"5.0★ (always green)",r49:"4.9★",r48:"4.8★",r47:"4.7★",r46:"4.6★",r45:"4.4–4.5★",r44:"<4.4★",cf:"no rating · messages look fine",cu:"no rating · messages unsure",cp:"no rating · messages look problematic",n:"no rating / no messages"};
const INK="#1E3A4C";
const B={roof:"#7EBEE0",cabin:"#9FD0EA",hull:"#6BB0D4",win:"#E8F6FC",water:"#5AA4C8"};
const H={roof:"#1E4A7A",body:"#2E5A8C",win:"#D6E4F2"};
const LOD=`<svg width="18" height="11" viewBox="0 0 48 30" aria-hidden="true" style="flex-shrink:0"><path d="M8 10 L24 3 L40 10 Z" fill="${B.roof}"/><rect x="10" y="10" width="28" height="10" fill="${B.cabin}"/><rect x="14" y="12" width="5" height="4" fill="${B.win}"/><rect x="21.5" y="12" width="5" height="4" fill="${B.win}"/><rect x="29" y="12" width="5" height="4" fill="${B.win}"/><path d="M2 20 H46 L42 26 H6 Z" fill="${B.hull}"/><path d="M0 28.5 q3 -2 6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0 t6 0" stroke="${B.water}" stroke-width="1.2" fill="none"/></svg>`;
const DUM=`<svg width="18" height="11" viewBox="0 0 48 30" aria-hidden="true" style="flex-shrink:0"><path d="M8 14 L24 3 L40 14 Z" fill="${H.roof}"/><rect x="12" y="14" width="24" height="14" fill="${H.body}"/><rect x="15" y="17" width="5" height="4" fill="${H.win}"/><rect x="28" y="17" width="5" height="4" fill="${H.win}"/><rect x="21.5" y="20" width="5" height="8" fill="${H.win}"/></svg>`;
const HEAD=`<svg width="9" height="9" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5.2" r="3.1" fill="${INK}"/><path d="M2.2 14.2c.6-3.2 2.8-4.8 5.8-4.8s5.2 1.6 5.8 4.8" fill="${INK}"/></svg>`;
const CARF=(c,sz)=>`<svg class="carf" width="${sz}" height="${sz}" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink:0;pointer-events:none"><path d="M5.5 10.5 7.2 6.4A2 2 0 0 1 9.05 5.2h5.9a2 2 0 0 1 1.85 1.2l1.7 4.1A2.5 2.5 0 0 1 20 12.8V17a1 1 0 0 1-1 1h-1.2a1 1 0 0 1-1-1v-1H7.2v1a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-4.2a2.5 2.5 0 0 1 1.5-2.3Z" fill="${c}"/><path d="M7.6 10.2h8.8l-1.2-3a.8.8 0 0 0-.75-.5h-5.1a.8.8 0 0 0-.75.5Z" fill="#FFFFFF" opacity="0.9"/><circle cx="7.3" cy="13.2" r="1.1" fill="#FFFFFF"/><circle cx="16.7" cy="13.2" r="1.1" fill="#FFFFFF"/></svg>`;
// Mode of transport (D.T from transport.json: code → [mode, note?]); a known plate (D.P) means car. No data → no icon.
const TR_LABEL={plane:"Plane",train:"Train",bus:"Bus",car:"Car",taxi:"Taxi"};
const TR_PATH={plane:"M8 1.2c.55 0 .9.6.9 1.3v3.6l5.6 3.3v1.5L8.9 9.2v3l1.7 1.3v1.2L8 14l-2.6.7v-1.2l1.7-1.3v-3L1.5 10.9V9.4l5.6-3.3V2.5c0-.7.35-1.3.9-1.3z",train:"M4.5 1.5h7a2 2 0 0 1 2 2v7a2 2 0 0 1-1.6 2l1.4 2h-1.6l-1.2-1.8H5.5l-1.2 1.8H2.7l1.4-2a2 2 0 0 1-1.6-2v-7a2 2 0 0 1 2-2zM4.3 3.6v3.6h7.4V3.6zM4.6 9.4v1.5h1.5V9.4zM9.9 9.4v1.5h1.5V9.4z",bus:"M3.5 1.5h9A1.5 1.5 0 0 1 14 3v9.5a1 1 0 0 1-1 1h-.5v1.2a.8.8 0 0 1-1.6 0v-1.2H5.1v1.2a.8.8 0 0 1-1.6 0v-1.2H3a1 1 0 0 1-1-1V3a1.5 1.5 0 0 1 1.5-1.5zM3.6 3.4v4.4h8.8V3.4zM4 10v1.4h1.6V10zM10.4 10v1.4H12V10z",taxi:"M6.2 1.4h3.6v1.7H6.2zM3.6 7l1.2-2.6A1.3 1.3 0 0 1 6 3.6h4a1.3 1.3 0 0 1 1.2.8L12.4 7a1.7 1.7 0 0 1 1.2 1.6v3.6a.8.8 0 0 1-.8.8h-1a.8.8 0 0 1-.8-.8v-.7H5v.7a.8.8 0 0 1-.8.8h-1a.8.8 0 0 1-.8-.8V8.6A1.7 1.7 0 0 1 3.6 7zM5.2 6.8h5.6l-.8-2a.5.5 0 0 0-.45-.3h-3.1a.5.5 0 0 0-.45.3zM4 8.6v1.2h1.6V8.6zM10.4 8.6v1.2H12V8.6z"};
const TRI=(m,c,sz)=>`<svg class="tr" width="${sz}" height="${sz}" viewBox="0 0 16 16" aria-label="${TR_LABEL[m]}" data-transport="${m}" style="flex-shrink:0;pointer-events:none"><path d="${TR_PATH[m]}" fill="${c}" fill-rule="evenodd"/></svg>`;
function transportOf(code){const t=D.T&&D.T[code];if(t&&TR_LABEL[t[0]])return {m:t[0],note:t[1]||""};if(D.P&&D.P[code])return {m:"car",note:""};return null}
const CAR=`<svg class="car" width="9" height="9" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 8.2 L5.1 5.8 h5.8 l1.9 2.4 H14 v3.1 h-1.2 a1.35 1.35 0 0 1-2.6 0 H5.8 a1.35 1.35 0 0 1-2.6 0 H2 V8.2 z" fill="${INK}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const idx=(d,o)=>Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(o.getFullYear(),o.getMonth(),o.getDate()))/864e5);
function pragueParts(d=new Date()){
  const parts=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Prague",year:"numeric",month:"2-digit",day:"2-digit",hour:"numeric",minute:"numeric",second:"numeric",hourCycle:"h23"}).formatToParts(d);
  const get=t=>parts.find(p=>p.type===t)?.value||"0";
  return {ymd:`${get("year")}-${get("month")}-${get("day")}`,hour:+get("hour"),minute:+get("minute"),second:+get("second")};
}
function pragueDayFraction(d=new Date()){
  const {hour,minute,second}=pragueParts(d);
  return Math.min(0.999,Math.max(0,(hour+minute/60+second/3600)/24));
}
function zoneLabel(frac){const h=frac*24;return h<CHECKOUT_H?"pre-checkout":h<CHECKIN_H?"cleaning":"check-in";}
function todayYmdFromIdx(origin,i){const d=addDays(origin,i);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}

const D=window.DATA;
// Last-minute arrivals (booked < 24 h before 15:00 check-in), from refresh.py.
const LAST_MIN=new Set(D.M||[]);
const LAST_MIN_TEXT="! Last-minute booking (< 24 h before check-in)";
const origin=parse(D.a), end=parse(D.b);
// Highlight the device's real "today" if it falls in range, else the build day.
const now=new Date(); let todayIdx=idx(now,origin);
const dayCount=idx(end,origin)+1;
if(todayIdx<0||todayIdx>=dayCount) todayIdx=idx(parse(D.t),origin);
const L=D.L; const hb=L.filter(x=>x[1]===1).length;

(function(){
  const el=document.getElementById("meta");
  const online=!!D.o;
  const src=D.src||"";
  const status=online
    ? `<span class="online">ONLINE${src==="sync"?" · sync":""}</span>`
    : `<span class="offline">OFFLINE</span>`;
  const lg=`<span class="lg" title="Stay colors: Airbnb guest rating (5★ green → ≤4.6 red). Dashed = no rating, judged from guest messages. Gray = no data."><i style="background:${TIER_BG.r5}">5★</i><i style="background:${TIER_BG.r49}">4.9</i><i style="background:${TIER_BG.r48}">4.8</i><i style="background:${TIER_BG.r47}">4.7</i><i style="background:${TIER_BG.r46}">≤4.6</i><i class="d">zprávy</i><i style="background:${STAY_BAR}">?</i></span>`;
  const metaTitle=online
    ? (src==="airbnb"
        ? `Aktualizace ${D.u} · ONLINE (live Airbnb host calendar)`
        : `Aktualizace ${D.u} · ONLINE (email/export sync, not live Airbnb API)`)
    : `Aktualizace ${D.u} · OFFLINE — no Airbnb host session`;
  const MAG=`<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9.6 9.6 L13.2 13.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>`;
  el.innerHTML=`<span class="meta-l" title="${esc(metaTitle)}">Aktualizace ${esc(D.u)} · ${status}${lg}</span><button type="button" id="search-btn" aria-label="Search stays" aria-expanded="false" title="Search by plate or guest">${MAG}</button><div id="search-panel"><input id="search-q" type="search" placeholder="Plate, guest, or note" autocomplete="off" spellcheck="false"><div id="search-hits"></div></div>`;
})();

// same-day turnaround listings (checkout day == checkin day within window)
const turnListings=(()=>{
  const outs={},inns={};
  for(const row of D.R){
    const listing=row[1],start=row[3],end=row[4];
    if(end>=D.a&&end<=D.b){(outs[listing]||(outs[listing]=new Set())).add(end);}
    if(start>=D.a&&start<=D.b){(inns[listing]||(inns[listing]=new Set())).add(start);}
  }
  const set=new Set();
  for(const name of Object.keys(outs)){
    const i=inns[name]; if(!i) continue;
    for(const day of outs[name]){ if(i.has(day)){ set.add(name); break; } }
  }
  return set;
})();

// names
let h=`<div class="nhead">Listing</div>`;
L.forEach(([name,kind],i)=>{
  if(i===hb) h+=`<div class="divider"></div>`;
  const isTurn=turnListings.has(name);
  const tip=isTurn?`${esc(name)} · same-day turnaround`:`${esc(name)} · ${kind===1?"houseboat":"house"}`;
  h+=`<div class="nrow ${kind===1?"boat":"house"}${i%2?" odd":""}${isTurn?" turn":""}" title="${tip}">${kind===1?LOD:DUM}<span>${esc(name)}</span></div>`;
});
document.getElementById("names").innerHTML=h;

// grid
const days=[];for(let i=0;i<dayCount;i++){const d=addDays(origin,i),wd=d.getDay();days.push({d,wd,we:wd===0||wd===6,today:i===todayIdx})}
const gridW=dayCount*DAY_W;
let g=`<div class="months">`;
for(let i=0;i<days.length;){const d=days[i].d;let j=i+1;while(j<days.length&&days[j].d.getMonth()===d.getMonth())j++;g+=`<div class="month" style="width:${(j-i)*DAY_W}px"><span class="ml">${MONTHS[d.getMonth()]} ${d.getFullYear()}</span></div>`;i=j}
g+=`</div><div class="days">`;
days.forEach(x=>{g+=`<div class="day${x.we?" we":""}${x.today?" today":""}"><span class="wd">${WEEKDAYS[x.wd]}</span><span class="dn">${x.d.getDate()}</span></div>`});
g+=`</div><div class="pdays">`;
const PARK_DAY=Array.from({length:dayCount},()=>({n:0,cars:[]}));
D.R.forEach(([code,listing,,s,e])=>{const a=Math.max(0,idx(parse(s),origin)),b=Math.min(dayCount,idx(parse(e),origin));const pl=D.P&&D.P[code];for(let i=a;i<b;i++){PARK_DAY[i].n++;if(pl)PARK_DAY[i].cars.push({listing,plate:pl});}});
// only known cars (plate in D.P) count toward the 12 spots; other stays are "car unknown"
PARK_DAY.forEach((pk,i)=>{const k=pk.cars.length,u=pk.n-k,pct=Math.round(k/12*100);g+=`<div class="pday${pct>=100?" red":pct>=50?" amber":""}" data-pday="${i}" title="Parking ${k}/12 known cars (${pct}%)${u?` · ${u} car unknown`:""}"><span class="pp">P</span><span class="pn">${k}</span></div>`});
g+=`</div><div id="body" style="height:${L.length*ROW_H}px"><div class="stripes">`;
L.forEach(([n],ri)=>{g+=`<div class="stripe${ri%2?" odd":""}" style="top:${ri*ROW_H}px;width:${gridW}px"></div>`});
g+=`</div><div class="cols">`;
days.forEach(x=>{g+=`<div class="col${x.today?" today":x.we?" we":""}"></div>`});
g+=`</div>`;
const preW=(CHECKOUT_H/24)*DAY_W, cleanW=((CHECKIN_H-CHECKOUT_H)/24)*DAY_W, inW=((24-CHECKIN_H)/24)*DAY_W;
g+=`<div class="tzones" style="left:${todayIdx*DAY_W}px;width:${DAY_W}px"><div class="tzone-pre" style="width:${preW}px" title="Pre-checkout (before 10:00)"></div><div class="tzone-clean" style="width:${cleanW}px" title="Cleaning gap (10:00–15:00)"></div><div class="tzone-in" style="width:${inW}px" title="Check-in (from 15:00)"></div></div>`;
g+=`<div class="nowline" id="nowBody" style="display:none"></div>`;
const by={};L.forEach(([n])=>by[n]=[]);
D.R.forEach(r=>{(by[r[1]]=by[r[1]]||[]).push(r)});
L.forEach(([name],ri)=>{
  g+=`<div class="row${ri===hb?" div":""}" style="top:${ri*ROW_H}px;width:${gridW}px">`;
  (by[name]||[]).forEach(([code,,guest,s,e,nights,gc])=>{
    const left=(idx(parse(s),origin)+0.5)*DAY_W;
    const w=Math.max(nights*DAY_W-4,DAY_W*.55);
    const gl=gc<0?"?":String(gc);
    const q=(D.Q&&D.Q[code])||["n",-1,""]; const tier=q[0]; const color=TIER_BG[tier]||STAY_BAR;
    const plate=(D.P&&D.P[code])||"";
    const t=`${guest} · ${name} · ${gl} guest${gc===1?"":"s"} · ${s} → ${e} · ${nights} night${nights===1?"":"s"} · ${code} · ${TIER_LABEL[tier]||""}${q[1]>=0?` · ${q[1]} reviews`:""}${q[2]?` · ${q[2]}`:""}${plate?` · Car: ${plate}`:""}${D.T&&D.T[code]&&TR_LABEL[D.T[code][0]]?` · ${TR_LABEL[D.T[code][0]]}${D.T[code][1]?` ${D.T[code][1]}`:""}`:""}`;
    let inner;
    if(gc>3){
      inner=`<span class="heads">${HEAD}</span><span class="n">${gl}</span>`;
    }else{
      const n=gc<0?0:gc;
      inner=`<span class="n">${gl}</span><span class="heads">${HEAD.repeat(n)}</span>`;
    }
    if(LAST_MIN.has(code)) inner=`<span class="lm" aria-label="last-minute booking">!</span>`+inner;
    const trm=transportOf(code);
    if(plate||(trm&&trm.m==="car")) inner+=CAR;
    if(trm&&trm.m!=="car") inner+=TRI(trm.m,INK,10);
    inner+=`<span class="g">${esc(guest)}</span>`;
    g+=`<div class="bar${tier[0]==="c"?" judged "+tier:""}" id="bar-${esc(code)}" data-code="${esc(code)}" data-t="${esc(t)}" title="${esc(t)}" style="left:${left}px;width:${w}px"><div class="bar-inner" style="background:${color}">${inner}</div></div>`;
  });
  g+=`</div>`;
});
g+=`</div>`;
g+=`<div class="dmark t" data-calday0 style="left:${todayIdx*DAY_W}px"></div><div class="dmark m" style="left:${(todayIdx+1)*DAY_W}px"></div>`;
g+=`<div class="nowline head" id="nowHead" style="display:none"></div>`;
const grid=document.getElementById("grid"); grid.style.width=gridW+"px"; grid.innerHTML=g;

// Live "now" line: Prague clock within today's column (checkout 10 / cleaning / check-in 15).
(function(){
  const todayIso=todayYmdFromIdx(origin,todayIdx);
  const place=()=>{
    const p=pragueParts();
    const frac=pragueDayFraction();
    const on=p.ymd===todayIso;
    const x=todayIdx*DAY_W+frac*DAY_W-1;
    const label=`Now · ${zoneLabel(frac)} · ${String(p.hour).padStart(2,"0")}:${String(p.minute).padStart(2,"0")} Prague`;
    ["nowBody","nowHead"].forEach(id=>{
      const el=document.getElementById(id);
      if(!el) return;
      if(!on){el.style.display="none";return;}
      el.style.display="block";
      el.style.left=x+"px";
      el.title=label;
    });
    const uk=document.getElementById("nowUk");
    if(uk){
      if(!on){uk.style.display="none";}
      else{uk.style.display="block";uk.style.left=(frac*118-1)+"px";uk.title=label;}
    }
  };
  place();
  setInterval(place,30000);
})();

// initial scroll near today
const sc=document.getElementById("scroller");
sc.scrollLeft=Math.max(0,(todayIdx-2)*DAY_W);

// mouse drag-to-pan (touch uses native momentum scrolling)
let drag=null;
// No pointer capture on pointerdown (that retargets the tap away from the bar); capture only once a real drag starts (>5px).
sc.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse"||e.button!==0)return;drag={x:e.clientX,l:sc.scrollLeft,m:false,cap:false,id:e.pointerId}});
sc.addEventListener("pointermove",e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x;if(!drag.m&&Math.abs(dx)>5){drag.m=true;sc.classList.add("dragging");try{sc.setPointerCapture(e.pointerId);drag.cap=true}catch(_){}}if(drag.m)sc.scrollLeft=drag.l-dx});
const up=e=>{if(!drag)return;const m=drag.m,cap=drag.cap;drag=null;sc.classList.remove("dragging");if(cap){try{sc.releasePointerCapture(e.pointerId)}catch(_){}};if(m){sc.dataset.justDragged="1";setTimeout(()=>delete sc.dataset.justDragged,0)}};
sc.addEventListener("pointerup",up);sc.addEventListener("pointercancel",up);

// Custom stay/uklidy tooltip: hover on desktop, tap/click on mobile.
// Native title stays as a fallback; it is temporarily removed while the card is open.
const tip=document.getElementById("tip");
let tipPinned=false, tipAnchor=null, tipTapAt=0;
// Bar under a tap: bar hit boxes (32px) overlap neighbouring rows, so take the bar whose centre is nearest
// among all bars at the point, else the nearest bar within a few px of it.
function barAt(x,y){
  let best=null,bd=Infinity;
  for(const n of document.elementsFromPoint(x,y)){const b=n.closest&&n.closest(".bar");if(!b)continue;const r=b.getBoundingClientRect();const d=Math.abs(y-(r.top+r.bottom)/2);if(d<bd){bd=d;best=b}}
  if(best) return best;
  for(const b of grid.querySelectorAll(".bar")){const r=b.getBoundingClientRect();if(x<r.left-6||x>r.right+6||y<r.top-4||y>r.bottom+4)continue;const dx=x<r.left?r.left-x:x>r.right?x-r.right:0;const d=dx*4+Math.abs(y-(r.top+r.bottom)/2);if(d<bd){bd=d;best=b}}
  return best;
}
function fineHover(){try{return window.matchMedia("(hover: hover) and (pointer: fine)").matches}catch(_){return true}}
function stayCard(code){
  const row=D.R.find(r=>r[0]===code);
  if(!row) return "";
  const [c,listing,guest,s,e,nights,gc]=row;
  const gl=gc<0?"?":String(gc);
  const q=(D.Q&&D.Q[c])||["n",-1,""];
  const plate=(D.P&&D.P[c])||"";
  let h=`<div class="tip-name">${esc(guest)}</div>`;
  h+=`<div class="tip-listing">${esc(listing)}</div>`;
  h+=`<div>${esc(s)} → ${esc(e)} · ${nights} night${nights===1?"":"s"}</div>`;
  h+=`<div>${esc(gl)} guest${gc===1?"":"s"}</div>`;
  h+=`<div>${esc(TIER_LABEL[q[0]]||"")}${q[1]>=0?` · ${q[1]} reviews`:""}</div>`;
  if(LAST_MIN.has(c)) h+=`<div class="tip-lm"><span class="lm-pill">!</span>${esc(LAST_MIN_TEXT.replace(/^!\s*/,""))}</div>`;
  if(q[2]) h+=`<div>${esc(q[2])}</div>`;
  const tr=transportOf(c);
  if(plate) h+=`<div class="tip-car">${CARF("#111827",15)}${esc(plate)}${tr&&tr.m==="car"&&tr.note?` · ${esc(tr.note)}`:""}</div>`;
  if(tr&&!(tr.m==="car"&&plate)) h+=`<div class="tip-tr">${tr.m==="car"?CARF("#111827",15):TRI(tr.m,"#111827",15)}${esc(TR_LABEL[tr.m])}${tr.note?` · ${esc(tr.note)}`:""}</div>`;
  h+=`<div class="tip-muted">${esc(c)}</div>`;
  return h;
}
function ukCard(el){
  const listing=el.dataset.listing||"";
  const guest=el.dataset.guest||"";
  const guests=el.dataset.guests||"?";
  const turn=el.dataset.turn==="1";
  let h=`<div class="tip-name">${esc(listing)} (${esc(guests)})</div>`;
  h+=`<div class="tip-listing">${esc(guest)}</div>`;
  if(turn) h+=`<div>same-day turnaround</div>`;
  if(el.dataset.lm==="1") h+=`<div class="tip-lm"><span class="lm-pill">!</span>${esc(LAST_MIN_TEXT.replace(/^!\s*/,""))}</div>`;
  if(el.dataset.plate) h+=`<div class="tip-car">${CARF("#111827",15)}${esc(el.dataset.plate)}</div>`;
  return h;
}
function hideTip(){
  if(tipAnchor&&tipAnchor.dataset.titleSaved!=null){
    tipAnchor.setAttribute("title", tipAnchor.dataset.titleSaved);
    delete tipAnchor.dataset.titleSaved;
  }
  tip.style.display="none";
  tip.innerHTML="";
  tipPinned=false;
  tipAnchor=null;
}
function showTip(anchor, html, pinned){
  if(!anchor||!html) return;
  if(tipAnchor&&tipAnchor!==anchor&&tipAnchor.dataset.titleSaved!=null){
    tipAnchor.setAttribute("title", tipAnchor.dataset.titleSaved);
    delete tipAnchor.dataset.titleSaved;
  }
  if(anchor.getAttribute("title")){
    anchor.dataset.titleSaved=anchor.getAttribute("title");
    anchor.removeAttribute("title");
  }
  tipAnchor=anchor;
  tipPinned=!!pinned;
  tip.innerHTML=html;
  tip.style.display="block";
  tip.style.left="-9999px";
  tip.style.top="0px";
  const r=anchor.getBoundingClientRect();
  const tw=tip.offsetWidth, th=tip.offsetHeight;
  const pad=8, vw=window.innerWidth, vh=window.innerHeight;
  let left=r.left;
  let top=r.bottom+6;
  if(top+th>vh-pad) top=r.top-th-6;
  if(left+tw>vw-pad) left=Math.max(pad, r.right-tw);
  if(left<pad) left=pad;
  if(top<pad) top=pad;
  if(top+th>vh-pad) top=Math.max(pad, vh-pad-th);
  tip.style.left=left+"px";
  tip.style.top=top+"px";
}
function hookTip(root, selector, htmlOf){
  root.addEventListener("mouseover",e=>{
    if(!fineHover()) return;
    const b=e.target.closest(selector);
    if(!b||!root.contains(b)) return;
    showTip(b, htmlOf(b), false);
  });
  root.addEventListener("mouseout",e=>{
    if(!fineHover()||tipPinned) return;
    const b=e.target.closest(selector);
    if(!b||!root.contains(b)) return;
    const to=e.relatedTarget;
    if(to&&(b.contains(to)||tip.contains(to))) return;
    hideTip();
  });
  root.addEventListener("click",e=>{
    if(root===grid&&sc.dataset.justDragged) return;
    const b=root===grid?barAt(e.clientX,e.clientY):e.target.closest(selector);
    if(!b||!root.contains(b)){
      if(!e.target.closest("#tip")) hideTip();
      return;
    }
    tipTapAt=Date.now();
    showTip(b, htmlOf(b), true);
  });
}
hookTip(grid, ".bar", b=>b.dataset.code?stayCard(b.dataset.code):(b.dataset.t||""));
function pdayCard(el){
  const i=+el.dataset.pday, pk=PARK_DAY[i]; if(!pk) return "";
  const d=addDays(origin,i), ymd=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const k=pk.cars.length, u=pk.n-k, pct=Math.round(k/12*100);
  let h=`<div class="tip-name">P${k} · ${k}/12 · ${pct}%${k>12?` · +${k-12} over`:""}</div><div class="tip-listing">${ymd} night</div>`;
  pk.cars.forEach(c=>{h+=`<div class="tip-car">${CARF("#111827",15)}${esc(c.plate)} · ${esc(c.listing)}</div>`});
  if(u>0) h+=`<div class="tip-muted">${u} stay${u===1?"":"s"}, car unknown</div>`;
  return h;
}
grid.addEventListener("mouseover",e=>{if(!fineHover())return;const b=e.target.closest(".pday");if(b)showTip(b,pdayCard(b),false)});
grid.addEventListener("mouseout",e=>{if(!fineHover()||tipPinned)return;const b=e.target.closest(".pday");if(!b)return;const to=e.relatedTarget;if(to&&(b.contains(to)||tip.contains(to)))return;hideTip()});
grid.addEventListener("click",e=>{if(sc.dataset.justDragged)return;const b=e.target.closest(".pday");if(!b)return;tipTapAt=Date.now();showTip(b,pdayCard(b),true)});
const hideOnScroll=()=>{if(Date.now()-tipTapAt<450)return;hideTip()};
sc.addEventListener("scroll",hideOnScroll,{passive:true});
sc.addEventListener("pointermove",e=>{if(drag&&drag.m) hideTip()});

document.getElementById("shell").addEventListener("scroll",hideOnScroll,{passive:true});
document.addEventListener("keydown",e=>{if(e.key==="Escape") hideTip()});
document.addEventListener("pointerdown",e=>{
  if(tip.style.display==="none") return;
  if(e.target.closest("#tip")) return;
  if(e.target.closest(".bar")||e.target.closest(".uk-row")||e.target.closest(".pday")) return;
  hideTip();
});


// Uklidy: scrollable past ← dnes/zítra/pozítří → future; gray outside focus
(function(){
  const CZ_WD=["ne","po","út","st","čt","pá","so"];
  const UK_COL_W=118;
  const today=parse(D.t);
  const start=parse(D.a);
  const end=parse(D.b);
  const total=idx(end,start)+1;
  const todayOff=Math.max(0,idx(today,start));
  const kind={}; L.forEach(([n,k])=>kind[n]=k);
  const row=(it,turn)=>`<div class="uk-row${turn?" turn":""}" data-listing="${esc(it.listing)}" data-guest="${esc(it.guest)}" data-guests="${esc(it.guests)}" data-turn="${turn?"1":"0"}" data-lm="${it.lm?"1":"0"}" data-plate="${esc(it.plate||"")}" title="${esc(it.listing+" ("+it.guests+") · "+it.guest+(turn?" · same-day turnaround":"")+(it.lm?" · last-minute booking":""))}">${it.kind===1?LOD:DUM}${it.lm?`<span class="lm">!</span>`:""}<span class="nm">${esc(it.listing)} (${esc(it.guests)})</span>${it.plate?CARF("#111827",12):""}</div>`;
  let html="";
  for(let i=0;i<total;i++){
    const day=addDays(start,i);
    const iso=`${day.getFullYear()}-${String(day.getMonth()+1).padStart(2,"0")}-${String(day.getDate()).padStart(2,"0")}`;
    const offToday=idx(day,today);
    const focus=offToday>=0&&offToday<=2;
    const label=`${CZ_WD[day.getDay()]} ${day.getDate()}.${day.getMonth()+1}`;
    const outs=[], inns=[];
    D.R.forEach(r=>{
      const item={listing:r[1],kind:kind[r[1]]??1,guests:r[6]<0?"?":String(r[6]),guest:r[2],lm:r[3]===iso&&LAST_MIN.has(r[0]),plate:(D.P&&D.P[r[0]])||""};
      if(r[4]===iso) outs.push(item);
      if(r[3]===iso) inns.push(item);
    });
    outs.sort((a,b)=>a.listing.localeCompare(b.listing));
    inns.sort((a,b)=>a.listing.localeCompare(b.listing));
    const turnSet=new Set();
    outs.forEach(it=>{ if(inns.some(x=>x.listing===it.listing)) turnSet.add(it.listing); });
    const mark=offToday===0?`<div class="uk-mark t"></div>`:offToday===1?`<div class="uk-mark m"></div>`:"";
    const nowUk=offToday===0?`<div class="nowline" id="nowUk" style="display:none"></div>`:"";
    html+=`<div class="uk-col${focus?"":" muted"}"${offToday===0?" data-ukday0":""}>${mark}${nowUk}<div class="uk-h" title="${esc(label+" · "+iso)}">${esc(label)}</div><div class="uk-list">`;
    html+=`<div class="uk-sec out"><div class="uk-sub">Odjezdy</div>`;
    html+= outs.length? outs.map(it=>row(it,turnSet.has(it.listing))).join("") : `<div class="uk-empty">—</div>`;
    html+=`</div><div class="uk-rule"></div><div class="uk-sec in"><div class="uk-sub">Příjezdy</div>`;
    html+= inns.length? inns.map(it=>row(it,turnSet.has(it.listing))).join("") : `<div class="uk-empty">—</div>`;
    html+=`</div></div></div>`;
  }
  const el=document.getElementById("uklidy");
  el.innerHTML=html;
  // dnes leftmost of the three focus days
  el.scrollLeft=todayOff*(UK_COL_W+4);
  hookTip(el, ".uk-row", ukCard);
  // scroll coupling with the calendar (and hiding the card on a user slide) is wired in NOW_SYNC below
  // place() may have run before #nowUk existed — set initial position now
  (function(){
    const uk=document.getElementById("nowUk");
    if(!uk) return;
    const p=pragueParts();
    const frac=pragueDayFraction();
    if(p.ymd!==D.t){uk.style.display="none";return;}
    uk.style.display="block";
    uk.style.left=(frac*UK_COL_W-1)+"px";
    uk.title=`Now · ${zoneLabel(frac)} · ${String(p.hour).padStart(2,"0")}:${String(p.minute).padStart(2,"0")} Prague`;
  })();
})();

// Calendar ↔ uklidy now-line coupling: uklidy follows the calendar so both red lines share one screen x.
// Sliding uklidy decouples it; when a slide ends within half a column of the calendar line it snaps back and re-couples.
const NOW_SYNC={cal:sc,uk:NOW_SYNC_UK(),coupled:true,prog:-1,held:false,anim:0,endTimer:0};
function NOW_SYNC_UK(){return document.getElementById("uklidy")}
(function(){
  const UK_W=118, SNAP_MS=180, END_MS=120, S=NOW_SYNC, uk=S.uk;
  S.prog=uk.scrollLeft;
  const frac=()=>pragueParts().ymd===D.t?pragueDayFraction():0.5;
  // screen-x of the uklidy now-line minus the calendar now-line
  const delta=()=>{const cd=sc.querySelector("[data-calday0]"),ud=uk.querySelector("[data-ukday0]");if(!cd||!ud)return null;const f=frac(),c=cd.getBoundingClientRect(),u=ud.getBoundingClientRect();return u.left+f*u.width-(c.left+f*c.width)};
  const set=v=>{uk.scrollLeft=v;S.prog=uk.scrollLeft};
  const stop=()=>{if(S.anim)cancelAnimationFrame(S.anim);S.anim=0};
  const align=()=>{const d=delta();if(d!==null&&Math.abs(d)>=0.5)set(uk.scrollLeft+d)};
  const snap=()=>{const d=delta();if(d===null)return;stop();S.coupled=true;const from=uk.scrollLeft,t0=performance.now();
    const step=t=>{const p=Math.min(1,Math.max(0,(t-t0)/SNAP_MS));set(from+d*(1-Math.pow(1-p,3)));if(p<1)S.anim=requestAnimationFrame(step);else{S.anim=0;align()}};
    S.anim=requestAnimationFrame(step)};
  const maybeSnap=()=>{if(S.held||S.coupled)return;const d=delta();if(d!==null&&Math.abs(d)<UK_W/2)snap()};
  const schedEnd=()=>{clearTimeout(S.endTimer);S.endTimer=setTimeout(maybeSnap,END_MS)};
  sc.addEventListener("scroll",()=>{if(S.coupled){stop();align()}else schedEnd()},{passive:true});
  uk.addEventListener("scroll",()=>{
    if(S.prog>=0&&Math.abs(uk.scrollLeft-S.prog)<1)return; // our own write
    S.prog=-1;stop();S.coupled=false;hideTip();schedEnd();
  },{passive:true});
  const hold=()=>{S.held=true;stop()};
  const release=()=>{if(!S.held)return;S.held=false;schedEnd()};
  uk.addEventListener("pointerdown",e=>{if(e.pointerType!=="touch")hold()});
  window.addEventListener("pointerup",e=>{if(e.pointerType!=="touch")release()});
  uk.addEventListener("touchstart",hold,{passive:true});
  uk.addEventListener("touchend",release);
  uk.addEventListener("touchcancel",release);
  const realign=()=>{if(S.coupled)align()};
  window.addEventListener("resize",realign);
  if(typeof ResizeObserver!=="undefined"){const ro=new ResizeObserver(realign);ro.observe(uk);ro.observe(sc)}
  setInterval(realign,30000);
  align(); requestAnimationFrame(realign); setTimeout(realign,400);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(realign);
})();

// Parking: one source of truth (only known cars, i.e. a plate in D.P, are counted). Tonight = sleeping here tonight (start<=today<end, same rule as the per-day P row);
// Now = in-house at the current Prague time (after 15:00 check-in, before 10:00 checkout). One car per counted stay, by listing.
(function(){
  const SPOTS=12, TAN=Math.tan(20*Math.PI/180);
  const btn=document.getElementById("park-btn"), panel=document.getElementById("park-panel"), cnt=document.getElementById("park-count");
  let mode="tonight";
  function stays(){
    const p=pragueParts(), today=p.ymd, now=[], tonight=[];
    D.R.forEach(([code,listing,guest,s,e])=>{
      const st={code,listing,guest,plate:(D.P&&D.P[code])||""};
      if(s<=today&&e>today) tonight.push(st);
      const arrived=s<today||(s===today&&p.hour>=CHECKIN_H), notLeft=e>today||(e===today&&p.hour<CHECKOUT_H);
      if(arrived&&notLeft) now.push(st);
    });
    const by=(a,b)=>a.listing.localeCompare(b.listing)||a.code.localeCompare(b.code);
    now.sort(by); tonight.sort(by);
    return {now,tonight,today,hhmm:`${String(p.hour).padStart(2,"0")}:${String(p.minute).padStart(2,"0")}`};
  }
  const PFONT="-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif", PMONO="ui-monospace,'SF Mono',SFMono-Regular,Menlo,monospace";
  // cars stay at the mirrored 20°; labels sit level in a row under each spot (outside the rotated group)
  function svg(cars){
    const W=36,H=70,off=H*TAN,top=6,labelH=30,vbW=SPOTS*W+off+8,vbH=H+top*2+labelH, shown=cars.slice(0,SPOTS);
    const fit=(t,fs,pc,av)=>t.length*fs*pc>av?` textLength="${av}" lengthAdjust="spacingAndGlyphs"`:"";
    let h=`<svg viewBox="0 0 ${vbW} ${vbH}" width="100%" role="img" aria-label="${shown.length} of ${SPOTS} parking spots taken by known cars" style="display:block"><rect x="0" y="0" width="${vbW}" height="${H+top*2}" rx="6" fill="#E5E7EB"/>`;
    for(let i=0;i<SPOTS;i++){
      const x0=4+i*W, c=shown[i], cx=x0+W/2+off/2, cy=top+H/2, base=x0+W/2+2;
      const lh=i===0?base-2:shown[i-1]?W/2-1.5:W-2, rh=i===SPOTS-1?vbW-base-2:shown[i+1]?W/2-1.5:W-2, av=Math.min(lh,rh,W)*2;
      h+=`<polygon points="${x0+off},${top} ${x0+W+off},${top} ${x0+W},${top+H} ${x0},${top+H}" fill="${c?"#D1D5DB":"#F9FAFB"}" stroke="#6B7280" stroke-width="1"${c?"":' stroke-dasharray="3 2"'}/>`;
      if(c) h+=`<g data-park-car="${esc(c.code)}" data-listing="${esc(c.listing)}" data-plate="${esc(c.plate)}" transform="translate(${cx} ${cy}) rotate(20)"><rect x="-11" y="-28" width="22" height="56" rx="7" fill="#334155"/><rect x="-9" y="-21" width="18" height="8" rx="2" fill="#93C5FD"/><rect x="-9" y="15" width="18" height="6" rx="2" fill="#93C5FD"/></g>`+
        `<g data-park-label="${esc(c.code)}"><text x="${base}" y="${top*2+H+10}" text-anchor="middle" font-size="11" font-weight="600" fill="#111827" font-family="${PFONT}"${fit(c.listing,11,.56,av)}>${esc(c.listing)}</text><text x="${base}" y="${top*2+H+23}" text-anchor="middle" font-size="9.5" font-weight="600" fill="#374151" font-family="${PMONO}"${fit(c.plate,9.5,.62,av)}>${esc(c.plate.toUpperCase())}</text></g>`;
      else h+=`<text x="${cx}" y="${cy+3}" text-anchor="middle" font-size="8" fill="#6B7280" font-family="${PFONT}">${i+1}</text>`;
    }
    return h+`</svg>`;
  }
  function render(){
    // only stays with a known plate (D.P) are cars; the rest are "car unknown" and never counted
    const info=stays(), all=mode==="tonight"?info.tonight:info.now, list=all.filter(x=>x.plate), n=list.length, unknown=all.length-n, over=Math.max(0,n-SPOTS), pct=Math.round(n/SPOTS*100);
    const tonightCars=info.tonight.filter(x=>x.plate).length;
    cnt.textContent=`Tonight ${Math.round(tonightCars/SPOTS*100)}%`; cnt.dataset.parkCapsule=String(tonightCars);
    const col=pct>=100?"#BE123C":pct>=50?"#B45309":"#1D4ED8";
    panel.innerHTML=`<div class="ph" style="align-items:center"><span>Parking</span><span class="ptabs" role="tablist"><button type="button" role="tab" data-park-tab="tonight" aria-selected="${mode==="tonight"}">Tonight</button><button type="button" role="tab" data-park-tab="now" aria-selected="${mode==="now"}">Now</button></span></div>`+
      `<div class="psum" data-park-n="${n}" data-park-unknown="${unknown}"><b>${n}/${SPOTS} · ${pct}%</b><span>· known car${n===1?"":"s"}</span>${over>0?`<span class="povr" data-park-over="${over}">+${over} over</span>`:""}</div>`+
      `<div class="pbar"><div style="width:${Math.min(100,pct)}%;background:${col}"></div></div>${svg(list)}`+
      `<div class="pnote" data-park-unknown-line="${unknown}" style="margin-top:4px;color:#6B7280">${unknown} other stay${unknown===1?"":"s"} ${mode==="tonight"?"tonight":"in-house now"} · car unknown</div>`+
      `<div class="pnote" style="color:#6B7280">${mode==="tonight"?`Sleeping here tonight (${info.today})`:`In-house now (${info.hhmm} Prague)`} · only stays with a known plate count</div>`+
      `<div class="pstays">${n?list.map((x,i)=>`<div class="pstay${i>=SPOTS?" ov":""}" data-park-stay="${esc(x.code)}"><span class="no">${i<SPOTS?i+1:"+"}</span><span class="ls">${esc(x.listing)}</span><span class="gs">${esc(x.guest)}</span><span class="pl" style="font-family:${PMONO}">${CARF("#111827",12)}${esc(x.plate.toUpperCase())}</span></div>`).join(""):`<div class="pnote">No known cars.</div>`}</div>`;
  }
  function setOpen(on){panel.classList.toggle("open",on);btn.setAttribute("aria-expanded",on?"true":"false");panel.setAttribute("aria-hidden",on?"false":"true");if(on)render();}
  btn.addEventListener("click",()=>setOpen(!panel.classList.contains("open")));
  cnt.addEventListener("click",()=>{mode="tonight";setOpen(true)});
  panel.addEventListener("click",e=>{const t=e.target.closest("[data-park-tab]");if(!t)return;mode=t.dataset.parkTab;render()});
  document.addEventListener("pointerdown",e=>{if(!panel.classList.contains("open"))return;if(panel.contains(e.target)||btn.contains(e.target)||cnt.contains(e.target))return;setOpen(false)});
  render(); setInterval(render,60000);
})();

// Search stays by plate, guest name, or hover-note text (ignore hyphens, spaces, case).
(function(){
  const norm=s=>String(s||"").replace(/[-\s]/g,"").toUpperCase();
  const btn=document.getElementById("search-btn");
  const panel=document.getElementById("search-panel");
  const input=document.getElementById("search-q");
  const hits=document.getElementById("search-hits");
  const shell=document.getElementById("shell");
  const scroller=document.getElementById("scroller");
  if(!btn||!panel||!input||!hits) return;
  let hitTimer=0;
  const index=D.R.map(([code,listing,guest,s,e,nights,gc])=>{
    const gl=gc<0?"?":String(gc);
    const q=(D.Q&&D.Q[code])||["n",-1,""];
    const plate=(D.P&&D.P[code])||"";
    const t=`${guest} · ${listing} · ${gl} guest${gc===1?"":"s"} · ${s} → ${e} · ${nights} night${nights===1?"":"s"} · ${code} · ${TIER_LABEL[q[0]]||""}${q[1]>=0?` · ${q[1]} reviews`:""}${q[2]?` · ${q[2]}`:""}${plate?` · Car: ${plate}`:""}`;
    return {code,listing,guest,s,e,plate,hay:norm([guest,plate,t].join(" "))};
  });
  function openPanel(on){
    panel.classList.toggle("open",on);
    btn.setAttribute("aria-expanded",on?"true":"false");
    if(on){input.focus();input.select();}
  }
  function jumpTo(code){
    document.querySelectorAll(".bar.hit").forEach(el=>el.classList.remove("hit"));
    const bar=document.getElementById("bar-"+code);
    if(!bar||!scroller) return;
    bar.classList.add("hit");
    const left=bar.offsetLeft, w=bar.offsetWidth;
    scroller.scrollLeft=Math.max(0,left-Math.max(24,(scroller.clientWidth-w)/2));
    if(shell){
      const sh=shell.getBoundingClientRect(), br=bar.getBoundingClientRect();
      if(br.top<sh.top+HEAD_H+14||br.bottom>sh.bottom){
        shell.scrollTop+=br.top-sh.top-HEAD_H-14-8;
      }
    }
    clearTimeout(hitTimer);
    hitTimer=setTimeout(()=>bar.classList.remove("hit"),8000);
    hits.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.code===code));
  }
  function render(){
    const q=norm(input.value);
    if(!q){hits.innerHTML=`<div class="empty">Type a plate or guest name</div>`;return;}
    const found=index.filter(it=>it.hay.includes(q));
    if(!found.length){hits.innerHTML=`<div class="empty">No matches</div>`;return;}
    hits.innerHTML=found.map(it=>`<button type="button" data-code="${esc(it.code)}"><div class="who">${esc(it.guest)} · ${esc(it.listing)}</div><div class="sub">${esc(it.s)} → ${esc(it.e)}${it.plate?` · Car: ${esc(it.plate)}`:""}</div></button>`).join("");
  }
  btn.addEventListener("click",e=>{e.stopPropagation();openPanel(!panel.classList.contains("open"));if(panel.classList.contains("open"))render();});
  input.addEventListener("input",render);
  input.addEventListener("keydown",e=>{
    if(e.key==="Escape"){openPanel(false);btn.focus();return;}
    if(e.key==="Enter"){
      const q=norm(input.value);
      const found=index.filter(it=>it.hay.includes(q));
      if(found.length===1) jumpTo(found[0].code);
    }
  });
  hits.addEventListener("click",e=>{
    const b=e.target.closest("button[data-code]");
    if(b) jumpTo(b.dataset.code);
  });
  document.addEventListener("pointerdown",e=>{
    if(!panel.classList.contains("open")) return;
    if(e.target.closest("#search-panel")||e.target.closest("#search-btn")) return;
    openPanel(false);
  });
})();

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
