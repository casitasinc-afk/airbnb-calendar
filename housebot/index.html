<style>

  html, body { margin: 0; height: 100%; }
  body { background: #d5eaf4; color: var(--ink); font: 16px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
  .shell { max-width: 440px; min-height: 100dvh; margin: 0 auto; background: #f6fbfd; display: flex; flex-direction: column; }
  header { display: flex; gap: 10px; align-items: center; padding: 12px 14px; background: var(--sea); color: #fff; }
  header svg { flex: 0 0 auto; display: block; }
  header strong { display: block; font-size: 18px; letter-spacing: .01em; }
  header p { margin: 1px 0 0; font-size: 13px; color: #d7eef8; }
  header button.link { margin-left: auto; border: 0; background: transparent; color: #fff; font: 700 13px system-ui; text-decoration: underline; cursor: pointer; padding: 6px; }
  #log { flex: 1; overflow: auto; padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 10px; }
  .bubble { max-width: 86%; padding: 9px 12px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bubble small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .02em; margin-bottom: 2px; opacity: .75; }
  .bubble.bot { align-self: flex-start; background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 5px; }
  .bubble.guest { align-self: flex-end; background: var(--sea); color: #fff; border-bottom-right-radius: 5px; }
  .bubble.host { align-self: flex-start; background: #ecfdf5; border: 1px solid #a7f3d0; border-bottom-left-radius: 5px; }
  .card { margin: 8px 14px; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .card h1 { margin: 0 0 6px; font-size: 20px; }
  .card p { margin: 0 0 12px; color: var(--muted); }
  label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  input[type="text"], input[type="search"], textarea { width: 100%; border: 1px solid #b7cdd8; border-radius: 12px; padding: 12px; font: 16px/1.35 system-ui; color: var(--ink); background: #fff; }
  textarea { resize: none; min-height: 46px; max-height: 120px; }
  button.go, button.pick { font: 700 16px/1 system-ui; cursor: pointer; }
  button.go { margin-top: 10px; width: 100%; border: 0; border-radius: 12px; background: var(--sea); color: #fff; padding: 13px; }
  button.go:disabled, button.send:disabled { opacity: .45; cursor: default; }
  .group { margin: 12px 0 4px; font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  button.pick { display: block; width: 100%; text-align: left; margin: 0 0 6px; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--foam); color: var(--ink); }
  button.pick span { display: block; font-size: 12px; font-weight: 600; color: var(--muted); }
  form.bar { display: flex; gap: 8px; align-items: flex-end; padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: #fff; }
  button.send { flex: 0 0 auto; border: 0; border-radius: 12px; background: var(--sea); color: #fff; font: 700 15px system-ui; padding: 12px 14px; cursor: pointer; }
  .hide { display: none !important; }
</style>
</head>
